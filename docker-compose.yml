services:
  # ── Database ──
  # Single-node replica set "rs0" — required for multi-document transactions
  # (sessions, withTransaction). Auth intentionally disabled in the container
  # so a keyFile is not required; app-level auth is handled by JWT.
  mongo:
    image: mongo:7
    container_name: lgr-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - lgr-mongo-data:/data/db
    healthcheck:
      # Idempotent: initiate the replica set once, then just check ok.
      # Running `rs.status()` on an uninitiated node throws NotYetInitialized → we catch and initiate.
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - lgr-network

  # ── Unified App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: lgr-app
    restart: unless-stopped
    ports:
      - "80:4001"
      - "4001:4001"
    working_dir: /app/packages/portal-api
    command: ["bun", "run", "start:unified"]
    environment:
      HOST: "0.0.0.0"
      MONGODB_URI: "mongodb://mongo:27017/lgr?replicaSet=rs0&directConnection=true"
      JWT_SECRET: "${JWT_SECRET:-lgr-dev-secret-change-in-production}"
      UPLOAD_DIR: "/app/uploads"
      MAX_FILE_SIZE: "50000000"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      DROPBOX_APP_KEY: "${DROPBOX_APP_KEY:-}"
      DROPBOX_APP_SECRET: "${DROPBOX_APP_SECRET:-}"
      ONEDRIVE_CLIENT_ID: "${ONEDRIVE_CLIENT_ID:-}"
      ONEDRIVE_CLIENT_SECRET: "${ONEDRIVE_CLIENT_SECRET:-}"
      EXCHANGE_RATE_API_KEY: "${EXCHANGE_RATE_API_KEY:-}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      OAUTH_BASE_URL: "${OAUTH_BASE_URL:-http://localhost:4001}"
      OAUTH_FRONTEND_URL: "${OAUTH_FRONTEND_URL:-http://localhost:4001}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - lgr-network

volumes:
  lgr-mongo-data:
  uploads:

networks:
  lgr-network:
    name: lgr-network
