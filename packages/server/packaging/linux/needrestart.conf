# LGR Server (gjovanov/lgr#370): needrestart lists lgr-server among the services a library upgrade
# left running old code, and never restarts it. A restart is the shop's to time: unattended-upgrades
# runs in the morning, and on a server switched on at opening time it runs at boot. The server
# restarts itself instead, in its maintenance window (UPDATE_WINDOW, 22:00-06:00 by default), once a
# library it runs on was replaced. The pattern covers both units: lgr-server.service and
# lgr-server-update.service.
$nrconf{override_rc}{qr(^lgr-server)} = 0;
