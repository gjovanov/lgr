[package]
name = "lgr-desktop"
version = "0.1.4"
edition = "2021"
description = "LGR Desktop - a server-mode client for LGR"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# ⚠ `Shell::open` is deprecated in favour of this. Clippy's `-D warnings` (which `ci.yml` runs)
# refuses the old call outright, which is the right outcome: opening a path or URL is exactly the
# operation worth keeping on a maintained, scoped API.
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# FR-14.5 — a second launch focuses the running instance instead of starting a rival that would
# fight it for the till's serial port.
tauri-plugin-single-instance = "2"
# FR-14.12 — the `lgr://` scheme. Every parameter it delivers is attacker-controlled input.
tauri-plugin-deep-link = "2"
# FR-14.7 — a per-user login item, so a till comes back by itself after a power cut.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# FR-14.10 — the diagnostics bundle. How a field problem gets from a shop PC to a developer.
zip = { version = "2", default-features = false, features = ["deflate"] }
# FR-14.12 — resolving a deep-link path against the server origin, and re-checking the result.
url = "2"
tauri-plugin-dialog = "2"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls"] }
# FR-14.26 (C18) — the native fiscal bridge opens the till's serial port itself.
# ⚠ This is why the transport is Rust and not Bun: Bun + `serialport` on Windows opens the port
# and writes, but NEVER delivers received bytes, which made the Eltrade A3 look dead for two days
# in September. Default features off — the `libudev` enumeration backend needs a C library at
# build time, and the lanes build on runners that do not have it; `available_ports()` still works.
serialport = { version = "4", default-features = false }
# Removed with local mode (FR-14.34):
#   · tokio — spawned and supervised the sidecar, and drove the nightly archive scheduler.
#     Nothing in the shell uses it directly now; `tauri::async_runtime` brings its own when a
#     later chunk needs one.
#   · rusqlite + zstd — the archive format for the local SQLite database. There is no local
#     database any more.
# ⚠ rusqlite and zstd were declared here but are NOT in the committed Cargo.lock, so the lock has
# been out of sync with this file for a while. `cargo tauri build` runs without `--locked` and
# regenerates it, which is how that went unnoticed.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
