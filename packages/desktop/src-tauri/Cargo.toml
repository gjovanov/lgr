[package]
name = "lgr-desktop"
version = "0.1.3"
edition = "2021"
description = "LGR Desktop - a server-mode client for LGR"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# Removed with local mode (FR-14.34):
#   · tokio — spawned and supervised the sidecar, and drove the nightly archive scheduler.
#     Nothing in the shell uses it directly now; `tauri::async_runtime` brings its own when a
#     later chunk needs one.
#   · rusqlite + zstd — the archive format for the local SQLite database. There is no local
#     database any more.
# ⚠ rusqlite and zstd were declared here but are NOT in the committed Cargo.lock, so the lock has
# been out of sync with this file for a while. `cargo tauri build` runs without `--locked` and
# regenerates it, which is how that went unnoticed.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
