[package]
name = "lgr-desktop"
version = "0.1.3"
edition = "2021"
description = "LGR Desktop - a server-mode client for LGR"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# ⚠ `Shell::open` is deprecated in favour of this. Clippy's `-D warnings` (which `ci.yml` runs)
# refuses the old call outright, which is the right outcome: opening a path or URL is exactly the
# operation worth keeping on a maintained, scoped API.
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# FR-14.5 — a second launch focuses the running instance instead of starting a rival that would
# fight it for the till's serial port.
tauri-plugin-single-instance = "2"
# FR-14.12 — the `lgr://` scheme. Every parameter it delivers is attacker-controlled input.
tauri-plugin-deep-link = "2"
# FR-14.7 — a per-user login item, so a till comes back by itself after a power cut.
tauri-plugin-autostart = "2"
# FR-14.28 — downloads the installer, checks its minisign signature against the key pinned in
# `updater.pub`, and runs it. Driven from Rust only (`install.rs`): no capability grants it, so
# neither the shell's pages nor the cloud app can start an update. ⚠ `native-tls` stays the backend
# its reqwest picks when both are on: FR-14.32 wants the OS trust store for lgrai.app, so a
# TLS-inspecting proxy the OS trusts still works. `rustls-tls` (ring, no bundled roots) is there only
# so a paired master's pin can be handed in through `configure_client` (FR-20.31, `trust.rs`).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "rustls-tls", "system-proxy"] }
# The same verifier the plugin uses, called directly by `--verify-update` (the release pipeline's
# check that the committed key matches the signing key) and again before anything is executed.
minisign-verify = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# FR-14.10 — the diagnostics bundle. How a field problem gets from a shop PC to a developer.
zip = { version = "2", default-features = false, features = ["deflate"] }
# FR-14.12 — resolving a deep-link path against the server origin, and re-checking the result.
url = "2"
tauri-plugin-dialog = "2"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
# Both with TWO TLS stacks, on purpose (`trust.rs`): native-tls is what a plain client gets, the OS
# store for lgrai.app (FR-14.32); rustls, with no roots of its own, carries a paired master's pin.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "rustls-tls-manual-roots"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls", "__rustls-tls"] }
# FR-20.31 — a master is trusted by the CA it was paired with, and by nothing else: rustls with a
# root store holding that one certificate, the same on every OS (`trust.rs`). lgrai.app keeps the
# OS store through native-tls (FR-14.32). ring, as rustls defaults to.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Reading a CA's SubjectPublicKeyInfo, to check it against the fingerprint a pairing code carries.
x509-cert = { version = "0.2", features = ["pem"] }
# FR-14.26 (C18) — the native fiscal bridge opens the till's serial port itself.
# ⚠ This is why the transport is Rust and not Bun: Bun + `serialport` on Windows opens the port
# and writes, but NEVER delivers received bytes, which made the Eltrade A3 look dead for two days
# in September. Default features off — the `libudev` enumeration backend needs a C library at
# build time, and the lanes build on runners that do not have it; `available_ports()` still works.
serialport = { version = "4", default-features = false }
# Removed with local mode (FR-14.34):
#   · tokio — spawned and supervised the sidecar, and drove the nightly archive scheduler.
#     Nothing in the shell uses it directly now; `tauri::async_runtime` brings its own when a
#     later chunk needs one.
#   · rusqlite + zstd — the archive format for the local SQLite database. There is no local
#     database any more.
# ⚠ rusqlite and zstd were declared here but are NOT in the committed Cargo.lock, so the lock has
# been out of sync with this file for a while. `cargo tauri build` runs without `--locked` and
# regenerates it, which is how that went unnoticed.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
