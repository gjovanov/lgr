<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- translate="no" above, and this: the app speaks four languages of its own. A translator replaces the page's
         text nodes, and the app then cannot place anything beside them (ui-shared/composables/foreign-anchor says
         what follows). -->
    <meta name="google" content="notranslate" />
    <script>
      // The language the page is in, said before anything reads it. A browser that takes a Bulgarian page for an
      // English one offers to translate it. The rule is ui-shared/plugins/i18n#initialLocale (the saved language,
      // else the browser's, else English), repeated here because this runs before the app can;
      // unit/page-language.test.ts holds the two together.
      try {
        var LGR_LANGS = ['en', 'mk', 'de', 'bg']
        var lgrLang = localStorage.getItem('lgr_locale')
        if (LGR_LANGS.indexOf(lgrLang) < 0) lgrLang = (navigator.language || '').split('-')[0]
        if (LGR_LANGS.indexOf(lgrLang) >= 0) document.documentElement.lang = lgrLang
      } catch (err) { /* storage can throw; the app says the language again once it has loaded */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LGR</title>
    <script>
      // FR-24.14: during a rollout this page and its entry script can come from pods on different
      // versions. An entry that fails to load reloads the page, a bounded number of times; a page
      // that mounted clears the count (main.ts). Past that the tab says so here, the app never
      // having started: a blank page is a dead tab, and no one can tell it from a slow one.
      // ⚠ Storage can throw (site data blocked, a locked-down webview), and this script is what runs
      // when nothing else can: every read of it is guarded.
      var LGR_BOOT_WORDS = {
        en: ['LGR could not start. Check the connection and try again.', 'Try again'],
        bg: ['LGR не успя да стартира. Проверете връзката и опитайте отново.', 'Опитай отново'],
        de: ['LGR konnte nicht starten. Prüfen Sie die Verbindung und versuchen Sie es erneut.', 'Erneut versuchen'],
        mk: ['LGR не можеше да стартува. Проверете ја врската и обидете се повторно.', 'Обиди се повторно'],
      }
      function lgrBootFailed() {
        var lang = 'en'
        try { lang = (navigator.language || 'en').slice(0, 2) } catch (err) {}
        var words = LGR_BOOT_WORDS[lang] || LGR_BOOT_WORDS.en
        var box = document.createElement('div')
        box.setAttribute('data-testid', 'boot-failed')
        box.style.cssText = 'font-family:system-ui,sans-serif;max-width:28rem;margin:20vh auto;padding:0 16px;text-align:center'
        var text = document.createElement('p')
        text.textContent = words[0]
        var again = document.createElement('button')
        again.textContent = words[1]
        again.onclick = function () {
          try { sessionStorage.removeItem('lgr_boot_retry') } catch (err) {}
          location.reload()
        }
        box.appendChild(text)
        box.appendChild(again)
        if (document.body) document.body.appendChild(box)
        else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box) })
      }
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || t.tagName !== 'SCRIPT' || t.type !== 'module') return
        var n
        try {
          n = Number(sessionStorage.getItem('lgr_boot_retry') || 0)
          if (n < 3) sessionStorage.setItem('lgr_boot_retry', String(n + 1))
        } catch (err) {
          return lgrBootFailed() // nothing to count in, so no way to know when to stop
        }
        if (n >= 3) return lgrBootFailed()
        setTimeout(function () { location.reload() }, 500 * (n + 1))
      }, true)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
