# Plain Secret template — DO NOT COMMIT the filled version. Seal it with kubeseal
# and commit only the SealedSecret (see README). The mounted-credentials access
# token used in local testing expires in ~hours; production needs a long-lived
# token from `claude setup-token` (run on a machine logged into the Max plan).
apiVersion: v1
kind: Secret
metadata:
  name: ocr-secret
  namespace: lgr
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: "REPLACE_WITH_output_of__claude_setup-token"
  # Optional metered fallback (used only if Claude Code errors):
  ANTHROPIC_API_KEY: ""
