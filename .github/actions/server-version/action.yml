name: The server release's version
description: >
  What a server-release.yml run builds: its version (checked against packages/server/Cargo.toml),
  its tag, whether it signs and publishes, and whether it is a TEST build. Each job works it out for
  itself after its checkout, so no job waits on a separate one for it (a job hop is a queue for a
  hosted runner). Also exports VERSION to the job's later steps. For a test build it makes this
  checkout one, before anything is built from it.

inputs:
  version:
    description: workflow_dispatch's `version` input (empty on a tag or a pull request)
    default: ''
  publish:
    description: workflow_dispatch's `publish_release` input
    default: 'false'
  test_keys:
    description: >
      workflow_dispatch's `test_keys` input (empty on a tag or a pull request). 'true' makes this
      checkout a TEST build (FR-20 plan F.4.4): packages/config/src/build-kind.json says
      "testKeys": true here, and nowhere else.
    default: 'false'

outputs:
  version:
    description: N.N.N
    value: ${{ steps.v.outputs.version }}
  tag:
    description: server-vN.N.N
    value: ${{ steps.v.outputs.tag }}
  release:
    description: "'true' when this run publishes the GitHub release"
    value: ${{ steps.v.outputs.release }}
  sign:
    description: "'true' unless this is a pull request or a test build (both build unsigned)"
    value: ${{ steps.v.outputs.sign }}
  test_keys:
    description: "'true' when this run makes a TEST build, 'false' otherwise"
    value: ${{ steps.v.outputs.test_keys }}

runs:
  using: composite
  steps:
    - id: v
      shell: bash
      env:
        # Through the environment, never interpolated into the script: `version` is a free string.
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_TEST_KEYS: ${{ inputs.test_keys }}
      run: |
        set -euo pipefail
        # NOTE tr: a Windows checkout has CRLF line ends, and `"$` never matches before a \r.
        CARGO="$(tr -d '\r' < packages/server/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
        case "$GITHUB_EVENT_NAME" in
          push)              VERSION="${GITHUB_REF#refs/tags/server-v}"; RELEASE=true ;;
          workflow_dispatch) VERSION="$INPUT_VERSION"; RELEASE="$INPUT_PUBLISH" ;;
          *)                 VERSION="$CARGO"; RELEASE=false ;;
        esac
        printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$VERSION' is not N.N.N"; exit 1; }
        [ "$VERSION" = "$CARGO" ] || { echo "::error::version $VERSION is not packages/server/Cargo.toml's $CARGO"; exit 1; }
        # A pull request builds unsigned; everything else is signed, and fails if it cannot be.
        SIGN=$([ "$GITHUB_EVENT_NAME" = pull_request ] && echo false || echo true)
        # FR-20 plan F.4.4: a TEST build trusts licence and identity keys named at run time, for the
        # field lanes' throwaway global alone. So only a dispatch makes one, it publishes nothing, and
        # it is never signed: no key of roomler's vouches for it. The committed file says false (the
        # guard in `adopt` and `package` holds that); this checkout alone is changed.
        case "${INPUT_TEST_KEYS:-false}" in
          false) TEST_KEYS=false ;;
          true)  TEST_KEYS=true ;;
          *)     echo "::error::test_keys is '$INPUT_TEST_KEYS', not true or false"; exit 1 ;;
        esac
        if [ "$TEST_KEYS" = true ]; then
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "::error::only a dispatch makes a test build, never a $GITHUB_EVENT_NAME"; exit 1; }
          [ "$RELEASE" = false ] || { echo "::error::a test build is never published: dispatch it with publish_release off"; exit 1; }
          KIND=packages/config/src/build-kind.json
          [ "$(tr -d '\r' < "$KIND" | grep -c '"testKeys": false')" = 1 ] \
            || { echo "::error::$KIND does not say \"testKeys\": false on one line, so this checkout cannot be made a test build"; exit 1; }
          # -b: Git Bash's sed would drop the CRs of a Windows checkout; GNU sed has it everywhere.
          sed -b -i 's/"testKeys": false/"testKeys": true/' "$KIND"
          [ "$(tr -d '\r' < "$KIND" | grep -c '"testKeys": true')" = 1 ] || { echo "::error::$KIND did not become a test build"; exit 1; }
          SIGN=false
        fi
        { echo "version=$VERSION"; echo "tag=server-v$VERSION"; echo "release=$RELEASE"; echo "sign=$SIGN"; echo "test_keys=$TEST_KEYS"; } >> "$GITHUB_OUTPUT"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version $VERSION, release $RELEASE, sign $SIGN, test keys $TEST_KEYS"
