name: Install the Tauri CLI
description: >
  Puts tauri-apps' own prebuilt cargo-tauri into cargo's bin directory, after checking it against
  a digest pinned here, so `cargo tauri ...` works as before without compiling tauri-cli. The
  compile (`cargo install tauri-cli --locked`) took 4 to 11 minutes in every desktop job: 258 s on
  Linux, 466 s on Windows, 523 s and 641 s on macOS in release run 40661387665. The Rust cache that
  could have held it never survives until the next release: the repository's 10 GB cache pool is
  full, and GitHub deletes an entry nobody used for 7 days anyway.

runs:
  using: composite
  steps:
    - name: Install cargo-tauri (prebuilt, digest-pinned)
      shell: bash
      env:
        # The one place the version lives. Bumping it means replacing the four digests below with the
        # new release's, from
        #   gh api repos/tauri-apps/tauri/releases/tags/tauri-cli-v<version> --jq '.assets[] | "\(.name) \(.digest)"'
        # and then dispatching desktop-ci.yml. It must stay a version whose tauri-bundler behaves as
        # desktop-release.yml expects (see its "Bundle each installer around its signed exe").
        VERSION: '2.10.1'
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        # Picked by the RUNNER, not by the build's --target: the CLI runs here and cross-compiles.
        # Both macOS legs run on an Apple-silicon runner, so the x64 app is built by the arm64 CLI.
        case "$OS/$ARCH" in
          Linux/X64)   asset=cargo-tauri-x86_64-unknown-linux-gnu.tgz; sha=ac869c0ecd657bf5fa9ae9bcc6664b1994b478abea512b3023c2e0d86e735833 ;;
          Windows/X64) asset=cargo-tauri-x86_64-pc-windows-msvc.zip;   sha=50a3ed1c43f75ea3b6e7233a52d8a7c994cfffd98d8545ff397db8b464338d9c ;;
          macOS/ARM64) asset=cargo-tauri-aarch64-apple-darwin.zip;     sha=f89d7d9485d3a6a6bcbc88275b0bddea61fe582ca636fc02c286994af1f6e36b ;;
          macOS/X64)   asset=cargo-tauri-x86_64-apple-darwin.zip;      sha=5e37b09604cf4d16dc6e83423e728e10f376b737f6443d1dd3121b9f8f050a1b ;;
          *) echo "::error::no tauri-cli $VERSION digest is pinned for a $OS/$ARCH runner"; exit 1 ;;
        esac

        # $RUNNER_TEMP is D:\a\_temp on Windows, and a backslash in a path means something to the tools
        # below: sha256sum escapes such a name by prefixing its output with one, which reads as a bad digest.
        tmp="$RUNNER_TEMP/tauri-cli"
        if [ "$OS" = Windows ]; then
          tmp=$(cygpath -u "$tmp")
        fi
        rm -rf "$tmp"
        mkdir -p "$tmp/x"
        curl -sSfL --retry 3 -o "$tmp/$asset" \
          "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$VERSION/$asset"

        # That release is not immutable: its assets could be replaced. The digest is the contract.
        if command -v sha256sum >/dev/null; then
          got=$(sha256sum < "$tmp/$asset" | cut -d' ' -f1)
        else
          got=$(shasum -a 256 < "$tmp/$asset" | cut -d' ' -f1)
        fi
        if [ "$got" != "$sha" ]; then
          echo "::error::$asset has sha256 $got, but $sha is pinned"
          exit 1
        fi

        case "$asset" in
          *.tgz) tar -xzf "$tmp/$asset" -C "$tmp/x" ;;
          *.zip) unzip -q "$tmp/$asset" -d "$tmp/x" ;;
        esac

        exe=cargo-tauri
        bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        if [ "$OS" = Windows ]; then
          exe=cargo-tauri.exe
          bin=$(cygpath -u "$bin")
        fi
        # Into cargo's own bin directory, over any copy a restored Rust cache brought back.
        mkdir -p "$bin"
        cp "$tmp/x/$exe" "$bin/$exe"
        chmod +x "$bin/$exe"

        have=$(cargo tauri --version)
        if [ "$have" != "tauri-cli $VERSION" ]; then
          echo "::error::cargo tauri --version says '$have', expected 'tauri-cli $VERSION'"
          exit 1
        fi
        echo "$have, from $asset (sha256 $sha)"
