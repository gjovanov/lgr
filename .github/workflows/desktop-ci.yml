name: Desktop CI

# FR-14.35b — the gate for the DESKTOP APP: on demand for a PR, and at every desktop tag.
#
# ⚠ `ci.yml` (C04) proves the repo builds on Linux: `bun run test`, `bun run build`, clippy on
# ubuntu and `cargo check` on macOS. What it does NOT do is build the app on Windows or macOS, or
# run it. A desktop regression that only shows on WebView2 would otherwise reach a tag.
#
# ## How this differs from `desktop-dry-build.yml`
#
# They look similar and are not the same gate, so the difference is written down rather than
# rediscovered:
#
#   · the dry build runs MONTHLY, on a schedule, with **no Rust cache on purpose** — a warm cache
#     would hide exactly the dependency-resolution drift it exists to catch (the 2026-07-20
#     breakage that went unnoticed for two months);
#   · this one runs on demand for a desktop PR and at every desktop tag, **with** a cache,
#     because without one the platform builds dominate the wait.
#
# Neither replaces the other. Delete the cache here and this becomes slow; add one there and it
# stops doing its job.
#
# ⚠ It deliberately does NOT run `bun run test`. That is `ci.yml`'s job on every PR already, and
# duplicating it would double the wait for every desktop change while proving nothing new.
#
# ⚠ **On demand, and at a desktop tag: no longer on every desktop PR (October 2026).** Hosted
# macOS minutes bill at 10x and Windows at 2x. Three platform builds on every desktop PR and
# merge, together with `ci.yml`'s macOS job, spent the account's whole free monthly allowance by
# 2026-10-07. GitHub then refused every job in this PRIVATE repository, the Linux gate included,
# for the rest of the month.
#
# So dispatch it for a PR that needs it, with `gh workflow run desktop-ci.yml --ref <branch>`.
# That means any PR touching `packages/desktop*`, and also these two, which nobody thinks to
# re-run it for:
#   · `packages/fiscal`, because a fiscal driver change with NO desktop change can still break the
#     bridge;
#   · `packages/e2e`, because the smoke job runs that code.
# A `desktop-v*` tag runs it by itself, so the release gate (FR-14.39) still finds it for the
# tagged commit.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

# Same rule as `ci.yml`: a second push makes the first run pointless, but master is never
# cancelled, because a red master has to be attributable to the commit that caused it.
concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # ⚠ Pinned, like everywhere else. An unpinned toolchain is how a green pipeline turns red on a
  # morning nobody changed anything.
  RUST_VERSION: '1.98'
  TAURI_CLI_VERSION: '2.10.1'

jobs:
  build:
    name: build unsigned (${{ matrix.platform }})
    strategy:
      # ⚠ One platform failing must not hide the other two. A Windows-only break and a
      # macOS-only break are different bugs, and fail-fast would report only the first.
      fail-fast: false
      # ⚠ **macOS is dropped from pull requests, for money.** A hosted macOS minute bills at
      # **10x** and a Linux one at 1x, so this 4-minute job cost **40 billable minutes** - half of
      # the 80 a full desktop run burned - on every push to every branch. Measured over 1-6 Oct this
      # repository spent ~3,889 billable minutes against a personal account's 2,000 included, and
      # Actions stopped scheduling jobs mid-afternoon: three PRs failed with zero steps executed and
      # no logs, which reads like a broken pipeline rather than a bill.
      #
      # ⚠ This is a real reduction in coverage, and it is deliberate. A macOS-only compile error
      # is caught at a `desktop-v*` tag, or by the monthly `desktop-dry-build.yml` sweep. The
      # alternative was paying 10x on every push for a platform nobody ships to a till today.
      #
      # Since the workflow went on-demand (header), the cheap pair is what a DISPATCH builds,
      # standing in for the pull request that used to trigger it. All three are built only at a
      # tag, the commit the release gate reads.
      #
      # ⚠ `fromJSON` because a matrix leg cannot carry its own `if:` - there is no way to skip
      # one combination, so the whole list is chosen up front.
      matrix:
        include: ${{ startsWith(github.ref, 'refs/tags/desktop-v')
          && fromJSON('[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb"},{"platform":"macos-latest","target":"aarch64-apple-darwin","bundles":"dmg"},{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]')
          || fromJSON('[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb"},{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]') }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # Keyed on `Cargo.lock` + the OS, so a dependency bump invalidates it and a source-only
      # change does not. Without this the three builds dominate PR time (C16).
      #
      # ⚠ `desktop-release.yml` uses the same job id and `key`, so the two share one cache per
      # target — change both or neither. Saved from master only: a branch or tag save is scoped to
      # that ref, no other run can restore it, and it only crowds the 10 GB pool.
      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/desktop/src-tauri
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # ⚠ Installed explicitly rather than trusted to the runner image — the image's contents are
      # not a contract. Same list as `ci.yml` and the dry build; they must not drift apart.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli@${{ env.TAURI_CLI_VERSION }} --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # ⚠ BEFORE cargo, in every job that invokes it. `tauri::generate_context!()` resolves
      # `frontendDist` ("../../desktop-ui/dist") at COMPILE time and panics inside the proc macro
      # if the directory is missing — which reads as a Rust error and is really a missing build
      # step. Do not "fix" that by creating an empty `dist/`: clippy would pass with a broken UI.
      - name: Build Desktop UI
        run: bun run build:desktop-ui

      # Unsigned on purpose: this runs on demand for a PR, and signing needs
      # `environment: release` plus the OIDC exchange (C05). Signing stays on tags and on the
      # monthly dry build.
      - name: Build Tauri app (unsigned)
        run: cd packages/desktop && cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Rust tests
        working-directory: packages/desktop/src-tauri
        run: cargo test --target ${{ matrix.target }}

      # The app binary, for the smoke job below and for anyone debugging a platform-only failure.
      - name: Upload the built app
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lgr-desktop-windows
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/lgr-desktop.exe
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7
          if-no-files-found: error

      # One annotation per run, on one leg, so the gap announces itself. A coverage reduction that
      # lives only in a comment is one nobody will remember a month from now.
      - name: Say that the CDP walk did not gate this run
        if: matrix.platform == 'ubuntu-22.04' && github.event_name != 'workflow_dispatch'
        run: echo "::warning title=CDP smoke not gating::windows smoke (CDP) is dispatch-only while gjovanov/lgr#116 is open - the debugging port never opens on this image, though the same spec passes locally against this job's own artifact. Run packages/e2e/tests/desktop-app.spec.ts locally, or dispatch Desktop CI, before changing the shell."

  windows-smoke:
    name: windows smoke (CDP)
    needs: build
    # ⚠ **DISPATCH-ONLY, and this is a deliberate weakening — gjovanov/lgr#116.** The port never
    # opens on this image: the app starts, the webview renders, and nothing listens on 9222. The
    # same spec passes on a developer machine **against the exact artifact this job built** (14
    # pass, 1 skipped, 24 s), so the subject is the image, not the product and not the harness.
    # Five hypotheses are ruled out by experiment in #116; the leading one left is that the
    # runner is elevated.
    #
    # It was a failing check on every commit, and `desktop-promote.yml` condition 1 refuses to
    # promote a release whose tagged commit carries ANY failing check — so an unexplained CI-only
    # failure was blocking the first signed release outright.
    #
    # ⚠ The cost is real and must not be forgotten: this walk is the only thing that has ever
    # caught four shipped bugs at once (empty views under the CSP, Open LGR deadlocking the app,
    # the unreachable page escaping to the system browser, `--status-json` lying). Run it locally
    # or dispatch it before changing the shell. The `build` jobs above run on demand and at every
    # desktop tag, and the annotation below makes sure nobody discovers this gap by accident.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ⚠ ARMED BY C15, not by this file. The CDP walk (`packages/e2e/tests/desktop-app.spec.ts`)
      # does not exist yet, and a job that runs a missing spec is a red gate — which C16's own
      # acceptance forbids ("never enable a red gate", the C04 rule). Every step below is
      # conditioned on this, so the job arms itself on the commit that adds the spec with no edit
      # here.
      #
      # ⚠ A STEP, not a job-level `if:`. The first version used
      # `if: hashFiles('…') != ''` on the job, and GitHub rejected the whole workflow at startup
      # — 0 s, 0 jobs, "this run likely failed because of a workflow file issue". `hashFiles`
      # reads `GITHUB_WORKSPACE`, and at job-evaluation time nothing is checked out yet, so the
      # function is not available in that context. It works here because `checkout` has run.
      #
      # ⚠ And it emits a NOTICE rather than passing quietly. A green job that silently ran
      # nothing is how a smoke test stays "enabled" for a year without executing once.
      - name: Is the desktop spec present yet?
        id: spec
        shell: bash
        run: |
          if [ -f packages/e2e/tests/desktop-app.spec.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Desktop smoke skipped::packages/e2e/tests/desktop-app.spec.ts does not exist yet (C15). This job arms itself when it lands."
          fi

      - name: Install Bun
        if: steps.spec.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # ⚠ Node must be on PATH, and this is a CHECK rather than an install (C15 trap 1).
      #
      # Playwright spawns its workers with `process.execPath`; under `bunx` on a machine with no
      # Node, every worker dies with `code=143` before a browser ever launches — for EVERY spec in
      # the package, not just this one. The symptom names nothing useful, which is why it cost
      # real time the first time.
      #
      # The `windows-latest` image ships Node, so installing one would be ceremony. What this
      # guards is the day somebody moves this job into a container, where it would not: the run
      # fails here, with the reason, instead of 20 lines later with `code=143`.
      - name: Assert Node is on PATH (Playwright's workers need it)
        if: steps.spec.outputs.present == 'true'
        shell: bash
        run: |
          if ! command -v node >/dev/null; then
            echo "::error::No Node on PATH. Playwright spawns workers with process.execPath and"
            echo "::error::every worker will die with code=143 before a browser launches (C15 trap 1)."
            exit 1
          fi
          node --version

      - name: Install JS dependencies
        if: steps.spec.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Download the built app
        if: steps.spec.outputs.present == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lgr-desktop-windows
          path: desktop-app

      - name: Install Playwright browsers
        if: steps.spec.outputs.present == 'true'
        working-directory: packages/e2e
        run: bunx playwright install --with-deps chromium

      # ⚠ **The runtime, not the app, is what opens the debugging port** — and the job used to
      # inherit whatever Microsoft baked into the image. That is how this gate was red for days:
      # every build passed, the app logged `setup complete` and `ui ready (route=/)`, and nothing
      # ever listened on 9222. The runner had WebView2 **153**.0.4234.48; the same spec passes on a
      # developer box running **154**. An image-supplied dependency that decides whether the gate
      # can pass at all has to be pinned or recorded, or the next failure is diagnosed from scratch.
      #
      # ⚠ A failed INSTALL does not fail the job, deliberately. The bootstrapper exits non-zero
      # when the runtime is already current, and the spec is the real judge of whether CDP works.
      # What this must never do is pass quietly after changing nothing, so it prints both versions
      # and emits a notice when they are identical.
      - name: Update the WebView2 Runtime, and record which one this is
        if: steps.spec.outputs.present == 'true'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          function Get-Wv2 { if (Test-Path $key) { (Get-ItemProperty $key).pv } else { '(not installed)' } }
          $before = Get-Wv2
          Write-Host "WebView2 before: $before"
          $exe = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          try {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $exe -UseBasicParsing
            # The bootstrapper is a STUB: it hands off to a background installer and returns at
            # once. `& $exe` left $LASTEXITCODE empty and the registry read 0.37 s later still
            # said 153, so the first version of this step proved nothing. Wait for the process,
            # then poll, because even a completed bootstrapper finishes after its child does.
            $proc = Start-Process -FilePath $exe -ArgumentList '/silent','/install' -Wait -PassThru
            Write-Host "bootstrapper exit: $($proc.ExitCode)"
          } catch {
            Write-Host "::warning::WebView2 bootstrapper did not run: $($_.Exception.Message)"
          }
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            if ((Get-Wv2) -ne $before) { break }
            Start-Sleep -Seconds 5
          }
          $after = Get-Wv2
          Write-Host "WebView2 after: $after"
          if ($before -eq $after) {
            Write-Host "::notice title=WebView2 unchanged::Still $after after waiting 180 s. EdgeUpdate may be restricted on this image; if the CDP port does not open, the runtime is no longer the leading suspect."
          }

      # ⚠ The HARNESS sets the debugging port, never the app (C15 trap 12). An app that opened a
      # debugging port on its own would ship one to customers.
      #
      # ⚠ `--workers=1`: there is one app instance and one debugging port — C08's single-instance
      # plugin guarantees exactly that — so parallel workers fight over both.
      - name: Desktop smoke over CDP
        if: steps.spec.outputs.present == 'true'
        working-directory: packages/e2e
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: '--remote-debugging-port=9222'
          LGR_DESKTOP_BIN: ${{ github.workspace }}/desktop-app/lgr-desktop.exe
        run: bunx playwright test tests/desktop-app.spec.ts --project=desktop-app --workers=1 --reporter=line

      # ⚠ The app's logs live under %LOCALAPPDATA%, which `upload-artifact` cannot reach with an
      # expression: the `env` context holds what the WORKFLOW set, not the runner's own
      # environment, so `${{ env.LOCALAPPDATA }}` expands to an empty string and the path becomes
      # `/com.lgr.desktop/logs/` — silently nothing, under `if-no-files-found: ignore`.
      #
      # So the shell, where `$env:LOCALAPPDATA` is real, copies them somewhere the action can see.
      - name: Collect the app log
        if: failure() && steps.spec.outputs.present == 'true'
        shell: pwsh
        run: |
          $src = Join-Path $env:LOCALAPPDATA 'com.lgr.desktop'
          New-Item -ItemType Directory -Force -Path artifacts/app-logs | Out-Null
          if (Test-Path $src) {
            Copy-Item $src -Destination artifacts/app-logs -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "collected from $src"
          } else {
            # Said out loud: an absent log directory means the app never started, which is a
            # different failure from a spec that ran and failed, and the artifact would not
            # distinguish them.
            #
            # NOTE: this block is deliberately pure ASCII. An em dash here is three UTF-8 bytes
            # that decode as 'a', '(euro)' and a RIGHT DOUBLE QUOTATION MARK when the runner's
            # temp .ps1 is read as ANSI - and PowerShell treats that last character as CLOSING a
            # string, so every token after it is a parse error. It failed exactly that way, with
            # "Unexpected token 'it'" pointing nowhere useful. Prose with dashes belongs in the
            # YAML comments outside the script, which nothing parses as PowerShell.
            "The app never wrote a log directory at $src - it likely did not start." |
              Out-File artifacts/app-logs/NO-LOGS.txt
          }

      # ⚠ A CI failure you cannot see is a CI failure you re-run. The app's own log is the only
      # record of the print and external-open paths, which are not observable from CDP at all.
      - name: Upload screenshots and the app log on failure
        if: failure() && steps.spec.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-smoke-failure
          path: |
            packages/e2e/test-results/
            packages/e2e/playwright-report/
            artifacts/app-logs/
          retention-days: 7
          if-no-files-found: ignore