name: Desktop Dry Build

# The robot that finds the next E0063 (FR-14.2).
#
# ⚠ This workflow exists because of a specific failure. On 2026-07-20 all three release runs died
# at "Install Tauri CLI", and the pipeline stayed broken for **over two months** — discovered only
# when someone went looking. A release pipeline is exercised, by definition, exactly when you most
# need it to work. So it is exercised monthly instead, on nobody's deadline.
#
# It builds the **unsigned** app on all three platforms and throws the artifacts away. Signing
# needs `environment: release` and the Entra OIDC exchange (FR-14.3), which is a tag-only path;
# what is being watched here is dependency and toolchain drift, not the signing material.

on:
  schedule:
    # The 1st of each month, 04:17 UTC. Off the hour on purpose — the top of the hour is when
    # Actions queues are busiest, and a scheduled job that is always late is a scheduled job people
    # stop trusting.
    #
    # ⚠ MONTHLY, not weekly, since October 2026, for money. Four three-platform builds a month (a
    # macOS minute bills at 10x) were a third of the free allowance, which this PRIVATE repository
    # overspent by 2026-10-07; after that GitHub refused every job, the Linux gate included. Drift is
    # now caught within a month, not a week. That is still the point: the 2026-07 breakage this
    # exists for went unnoticed for two. Dispatch it before a desktop release.
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  BUN_VERSION: '1.3.10'
  TAURI_CLI_VERSION: '2.10.1'
  RUST_VERSION: '1.98'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # ⚠ No Rust cache here, deliberately, unlike every other job. A warm cache would hide
      # exactly the dependency-resolution drift this workflow exists to catch.

      - name: Install Tauri CLI
        run: cargo install tauri-cli@${{ env.TAURI_CLI_VERSION }} --locked

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Desktop UI
        run: bun run build:desktop-ui

      - name: Build Tauri app (unsigned, discarded)
        run: cd packages/desktop && cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  report:
    name: open an issue if the dry build broke
    needs: build
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # ⚠ Without this, a scheduled workflow fails into an empty room: nobody is watching the
      # Actions tab on a Monday morning, and no PR is annotated. That silence is precisely how the
      # 2026-07-20 breakage lasted two months.
      - name: File or update an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Desktop dry build is failing"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          BODY=$(printf '%s\n' \
            "The monthly unsigned desktop build failed." \
            "" \
            "Run: $RUN_URL" \
            "Commit: $GITHUB_SHA" \
            "" \
            "This workflow exists to catch dependency and toolchain drift BEFORE a release needs" \
            "the pipeline to work. Fix it now rather than at tag time (FR-14.2).")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
