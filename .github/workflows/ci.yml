name: CI

# ⚠ Before this file there was NO CI on this repository. The only workflow was
# `desktop-release.yml`, which could not build: all three runs on 2026-07-20 died at "Install
# Tauri CLI" and nobody noticed for over two months (FR-14.2, FR-14.35).
#
# So this gate is deliberately the cheap, always-on one: it runs on every pull request and every
# push to master, on Linux only, and finishes in minutes. The per-platform desktop builds and the
# Windows smoke live in `desktop-ci.yml` (FR-14.35), and the heavy nightly e2e runs on mars rather
# than on paid Actions minutes.
#
# ⚠ Where the Linux jobs run: the repository variable LGR_LINUX_RUNNER, unset meaning GitHub-hosted
# `ubuntu-24.04` (pinned: `ubuntu-latest` began moving to Ubuntu 26 on 2026-10-19, and an image's
# contents are not a contract). Since the repository went public, hosted minutes cost nothing, so
# the jobs run there (2026-10-30). `["self-hosted","lgr-mars"]` sends them to the two mars runners,
# the fallback for when GitHub's queue is the slow part: infra/ci-runner/. Hosted runners are shared
# with roomler-ai's CI under one account (20 jobs at a time).

on:
  pull_request:
  push:
    branches: [master]
    # The desktop release gate (`desktop-promote.yml`) reads THIS workflow's checks for the tagged
    # commit, `cargo check (macos)` among them. That job no longer runs on master pushes (below),
    # so a desktop tag runs the workflow itself and the gate finds every check it names.
    tags: ['desktop-v*']
  workflow_dispatch:

# A second push to a branch makes the first run pointless. Master is never cancelled, because a
# red master needs to be attributable to the commit that caused it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # Bun's version is `.bun-version`, read by every setup-bun step: the same file the Dockerfile's
  # base image is checked against (unit/bun-pin.test.ts), so CI runs the Bun production runs.
  # ⚠ Pinned, not `stable`. An unpinned toolchain is how a green pipeline turns red on a morning
  # nobody changed anything — the same class of drift as the unpinned `cargo install` below.
  # `packages/desktop/src-tauri/rust-toolchain.toml` carries the same version for local work.
  RUST_VERSION: '1.98'

jobs:
  # ⚠ The suite in three shards side by side, and everything that builds in a job of its own beside
  # them. Until 2026-10-30 the builds (UIs, the server package, its boot and the two-node lane) ran
  # after the suite in one job, `test + build (ubuntu)`, and the suite ran file after file (19m56s of
  # a 21m49s job, run 40967014117). The check names a release gate reads are `test (ubuntu)` (the
  # aggregate below) and `build + clippy (ubuntu)`; desktop-promote.yml accepts the old names too.
  test-shard:
    name: test (ubuntu, shard ${{ matrix.shard }}/3)
    # The switch the header describes.
    runs-on: ${{ fromJSON(vars.LGR_LINUX_RUNNER || '"ubuntu-24.04"') }}
    # A shard takes a few minutes. A hang should not hold a runner for half an hour.
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # ⚠ Self-hosted only. The runners' /tmp is a 3 GB tmpfs (infra/ci-runner/README.md), and a run
      # that is cancelled or killed never stops its test mongod, so that mongod's data dir stays
      # behind, up to ~300 MB of preallocated journal each. Enough of them and every later job dies
      # with ENOSPC in places that look unrelated: a rustup download, a temp file in a test
      # (2026-10-25: 456 of them on one runner, both Linux jobs of four PRs failed). A runner takes
      # one job at a time, so a data dir no live mongod holds belongs to nobody.
      - name: Clear test databases an interrupted run left in /tmp
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          inuse=$(ps -eo args | grep -o -- '--dbpath /tmp/mongo-mem-[^ ]*' | sed 's|--dbpath ||' | sort -u || true)
          for d in /tmp/mongo-mem-*; do
            [ -e "$d" ] || continue
            printf '%s\n' "$inuse" | grep -qx -- "$d" || rm -rf -- "$d"
          done
          find /tmp -mindepth 1 -maxdepth 1 -name 'lgr-*' -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          df -h /tmp | tail -1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # ⚠ Hosted only. The self-hosted runner keeps its home between runs, so ~/.bun/install/cache
      # is already there, and restoring it re-downloaded and re-extracted 118 MB (16 s) every run.
      - name: Cache Bun install
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `mongodb-memory-server` downloads a mongod on first use. Without this every run pays for
      # it, and a flaky download becomes a flaky test suite.
      # ⚠ Its download directory is pinned to the cached path. Unpinned, it downloaded elsewhere on
      # this runner, so the cache never had anything to save ("Path Validation Error … no cache is
      # being saved", every run until 2026-10-24). On the self-hosted runner, which keeps its home
      # between runs, the pin also makes the download a one-off, and the cache is not needed there.
      - name: Pin mongodb-memory-server's download directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache mongodb-memory-server binaries
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # What each test file took the last time master ran it, which Bun's --shard splits the files
      # by (three equal TIMES, not three equal counts) and --parallel starts slowest first. Only ever
      # a split and an order: a stale or missing file changes how even the shards are, nothing else.
      - name: The last measured time of each test file
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .test-timings/last.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-

      # ⚠ Serially the suite took 19m56s of a 21m49s job (run 40967014117: 3680 tests, 354 files),
      # and most of a typical file was its own replica set starting, indexing and stopping. So:
      # - this shard's files on one Bun worker per CPU the job may use (`--parallel`), each file in a
      #   fresh global (implied), so a file can never pass on what another left behind;
      # - one replica set for the shard (with-test-mongo.ts), where each worker keeps one database
      #   from file to file and empties it in between (packages/tests/src/setup.ts).
      # ⚠ The CPUs come from the cgroup quota where there is one, not `nproc`: a mars runner container
      # is capped at 8 of the host's 16 cores and `nproc` says 16, as does Bun's default worker count.
      # --update-timings writes what THIS shard's files took to shard.json, for the `test` job below.
      - name: Test
        run: |
          cpus=$(awk '$1 != "max" { print int($1 / $2) }' /sys/fs/cgroup/cpu.max 2>/dev/null || true)
          [ "${cpus:-0}" -ge 1 ] || cpus=$(nproc)
          echo "test workers: $cpus"
          mkdir -p .test-timings
          bun packages/tests/src/with-test-mongo.ts bun run test --parallel="$cpus" \
            --shard=${{ matrix.shard }}/3 \
            --timings=.test-timings/shard.json --timings=.test-timings/last.json --update-timings
        env:
          # The PDF renderer keeps Chrome's sandbox for a non-root process (FR-20.25). This
          # runner is non-root on Ubuntu, whose AppArmor default refuses the user namespaces the
          # sandbox needs, so Chrome would not start. Production keeps the sandbox: since #192 it
          # runs as uid 1000 too, in a pod that allows it.
          PDF_CHROME_NO_SANDBOX: '1'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: .test-timings/shard.json
          if-no-files-found: ignore
          retention-days: 1

  # The check a release gate reads: green only when every shard is. It also merges the shards'
  # timings and, on master, keeps them for the next run's split.
  test:
    name: test (ubuntu)
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.LGR_LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          [ "$SHARDS" = success ] || { echo "::error::the test shards: $SHARDS"; exit 1; }
          echo "all three shards passed"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-timings-*
          path: .test-timings

      - name: One timings file from the three
        run: |
          set -euo pipefail
          jq -s '{ version: 1, files: (map(.files) | add) }' .test-timings/test-timings-*/shard.json > .test-timings/last.json
          echo "timings for $(jq '.files | length' .test-timings/last.json) files"

      # Master only: a pull request's save would be scoped to that pull request, and master's is the
      # one every run starts from. A new key per run, because a cache entry cannot be overwritten.
      - name: Keep them for the next run
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .test-timings/last.json
          key: test-timings-${{ github.run_id }}-${{ github.run_attempt }}

  build:
    name: build + clippy (ubuntu)
    # The switch the header describes.
    runs-on: ${{ fromJSON(vars.LGR_LINUX_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      # ⚠ Self-hosted only. The runners' /tmp is a 3 GB tmpfs (infra/ci-runner/README.md), and a run
      # that is cancelled or killed never stops its test mongod, so that mongod's data dir stays
      # behind, up to ~300 MB of preallocated journal each. Enough of them and every later job dies
      # with ENOSPC in places that look unrelated: a rustup download, a temp file in a test
      # (2026-10-25: 456 of them on one runner, both Linux jobs of four PRs failed). A runner takes
      # one job at a time, so a data dir no live mongod holds belongs to nobody.
      - name: Clear test databases an interrupted run left in /tmp
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          inuse=$(ps -eo args | grep -o -- '--dbpath /tmp/mongo-mem-[^ ]*' | sed 's|--dbpath ||' | sort -u || true)
          for d in /tmp/mongo-mem-*; do
            [ -e "$d" ] || continue
            printf '%s\n' "$inuse" | grep -qx -- "$d" || rm -rf -- "$d"
          done
          find /tmp -mindepth 1 -maxdepth 1 -name 'lgr-*' -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          df -h /tmp | tail -1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ⚠ The frontend must be BUILT before cargo runs, in every job that invokes cargo.
      # `tauri::generate_context!()` resolves `frontendDist` ("../../desktop-ui/dist") at COMPILE
      # time and panics inside the proc macro if the directory is missing:
      #
      #   error: proc macro panicked
      #     --> src/main.rs:84:14
      #      = help: message: The `frontendDist` configuration is set to `"../../desktop-ui/dist"`
      #              but this path doesn't exist
      #
      # That reads like a Rust error and is really a missing build step. Do not "fix" it by
      # creating an empty `dist/` — that would let clippy pass while the UI itself is broken.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # Hosted only: the self-hosted runner keeps ~/.bun (see `test-shard`).
      - name: Cache Bun install
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The mongod mongodb-memory-server downloads, where `test-shard` keeps it: the supervisor's bootstrap
      # test (P1-2), the package's boot and the two-node lane all run a real one. Restored only;
      # `test-shard` saves it. (Hosted only: the self-hosted runner keeps it in its home.)
      - name: Pin mongodb-memory-server's download directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Restore mongodb-memory-server binaries
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      # Includes `desktop-ui` (FR-14.8), which cargo needs (above) — that package was NOT built by
      # anything until FR-14.34, and bit-rotted unnoticed for four days in August because of it.
      - name: Build all UIs
        run: bun run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      # ⚠ Self-hosted: cargo's target lives in the runner's home, outside the checkout (which the
      # next job's checkout would clean), so a run builds on the last one's artifacts. Restoring
      # Swatinem's copy instead downloaded ~956 MB from GitHub's cache at ~25 MB/s: 1m53s of a
      # 3m30s job (run 40967014117), for a disk that already had it.
      # ⚠ Over the cap it is dropped WHOLE, never pruned file by file: cargo decides what to rebuild
      # from `.fingerprint/`, so an output deleted under a surviving fingerprint is never rebuilt
      # (roomler-ai docs/build-caches.md, rc.422-424). One cold build is the price of a correct one.
      - name: Keep cargo's target on the runner
        if: runner.environment == 'self-hosted'
        run: |
          t="$HOME/.cache/lgr-cargo-target"
          mb=$(du -sm "$t" 2>/dev/null | cut -f1)
          if [ "${mb:-0}" -gt 6000 ]; then
            echo "target is $mb MB (cap 6000): dropping it whole"
            rm -rf "$t"
          else
            echo "target is ${mb:-0} MB (cap 6000): kept"
          fi
          mkdir -p "$t"
          echo "CARGO_TARGET_DIR=$t" >> "$GITHUB_ENV"
          df -h "$HOME" | tail -1

      # ⚠ Hosted only (the step above is the self-hosted twin). Saved from master only. Pull requests
      # restore master's cache but must not save their own: a PR save is scoped to that PR, and one
      # PR's saves once took 3.2 GB of the 10 GB pool.
      - name: Rust cache
        if: runner.environment != 'self-hosted'
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            packages/desktop/src-tauri
            packages/server
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # ⚠ Installed explicitly rather than trusted to the runner image. Tauri 2's Linux build
      # needs all of these, and the image's contents are not a contract.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Clippy
        working-directory: packages/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # FR-20 plan steps P1-1 and P1-2: the supervisor a master runs. Its tests start and kill real
      # child processes, talk over a real unix socket, and bootstrap a real mongod when one is here.
      - name: Supervisor (lgr-server) clippy and tests
        working-directory: packages/server
        run: |
          cargo clippy --all-targets -- -D warnings
          found="$(ls ~/.cache/mongodb-binaries/mongod-* 2>/dev/null | grep -v '\.mdmp$' | head -1)"
          # Exported only when found: an exported empty value is not an unset one.
          if [ -n "$found" ]; then export LGR_SERVER_TEST_MONGOD="$found"; fi
          echo "mongod for the bootstrap test: ${found:-none, so it is skipped}"
          cargo test

      # FR-20.26 (plan step P0b-9): the package a master runs, built from the UIs built above, then
      # checked (AC 21, 66, 67), booted against a real database, and rebuilt to show that the same
      # commit gives the same bytes.
      - name: Build the server package
        run: bun run build:server

      - name: Check the server package
        run: bun run check:package

      # FR-20.25: the Chrome a master ships (`chrome-headless-shell`, pinned tree by tree in
      # packages/server/pdf-browser.lock.json), so the invoice the boot prints is printed by it,
      # not by puppeteer's own download.
      - name: Fetch the master's PDF browser
        run: bun scripts/fetch-pdf-browser.ts --platform linux --out dist/lgr-home

      - name: Boot the server package
        run: bun test packages/tests/src/integration/server-package.flow.test.ts --env-file=.env.test --timeout 300000
        env:
          LGR_SERVER_PACKAGE: dist/lgr-server
          # Chrome's sandbox needs user namespaces this runner's AppArmor refuses (see `test-shard`).
          PDF_CHROME_NO_SANDBOX: '1'
          PUPPETEER_EXECUTABLE_PATH: ${{ github.workspace }}/dist/lgr-home/chrome/chrome-headless-shell

      - name: The server package is reproducible
        run: |
          bun run build:server --out dist/lgr-server-again
          if ! cmp dist/lgr-server/server-manifest.json dist/lgr-server-again/server-manifest.json; then
            # Say WHAT differs, so a flake can be chased rather than re-run.
            bun scripts/explain-package-diff.ts dist/lgr-server dist/lgr-server-again
            exit 1
          fi

      # FR-20 plan step T-1: a global and a master, each the package just built on its own replica
      # set, with the chaos proxy and the TLS front between them.
      - name: Two nodes
        run: bun test packages/tests/src/two-node --env-file=.env.test --timeout 300000
        env:
          LGR_TWO_NODE: '1'
          LGR_SERVER_PACKAGE: dist/lgr-server
          PDF_CHROME_NO_SANDBOX: '1'

  macos-check:
    name: cargo check (macos)
    runs-on: macos-latest
    # ⚠ Not on pull requests, for money - and this restores what the header above already
    # claims this workflow is ("the cheap, always-on one ... on Linux only"). The macOS job
    # arrived later and quietly broke that premise: a hosted macOS minute bills at **10x**, this
    # workflow has NO path filter, so a README-only PR paid 10x to type-check Rust.
    #
    # ⚠ And, since October 2026, not on pushes to master either. A macOS run on every merge, with
    # `desktop-ci.yml`'s per-PR builds, spent the account's whole free monthly allowance by
    # 2026-10-07. GitHub then refused every job in this PRIVATE repository, the Linux gate included,
    # for the rest of the month.
    #
    # It runs on demand (`gh workflow run ci.yml --ref <branch>`) and on a `desktop-v*` tag, because
    # the release gate needs it green for the tagged commit. The trade is stated plainly: a
    # macOS-only compile error now surfaces when someone asks, on the monthly
    # `desktop-dry-build.yml`, or at the tag, not on the merge.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same reason as the clippy job: `generate_context!()` needs `desktop-ui/dist` to exist
      # before cargo runs at all.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Desktop UI
        run: bun run build:desktop-ui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/desktop/src-tauri
          # Same rule as clippy's: a tag or branch save here is one no later run can restore.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # ⚠ `check`, not `build`, and not clippy either. macOS minutes are the expensive ones; what
      # this job is for is the platform-conditional code that only compiles on a Mac — the
      # `#[cfg(target_os = ...)]` branches Linux never sees.
      - name: Cargo check
        working-directory: packages/desktop/src-tauri
        run: cargo check --all-targets
