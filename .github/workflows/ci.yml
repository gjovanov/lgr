name: CI

# ⚠ Before this file there was NO CI on this repository. The only workflow was
# `desktop-release.yml`, which could not build: all three runs on 2026-07-20 died at "Install
# Tauri CLI" and nobody noticed for over two months (FR-14.2, FR-14.35).
#
# So this gate is deliberately the cheap, always-on one: it runs on every pull request and every
# push to master, on Linux only, and finishes in minutes. The per-platform desktop builds and the
# Windows smoke live in `desktop-ci.yml` (FR-14.35), and the heavy nightly e2e runs on mars rather
# than on paid Actions minutes.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A second push to a branch makes the first run pointless. Master is never cancelled, because a
# red master needs to be attributable to the commit that caused it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # Matches the runtime the Dockerfile ships (oven/bun:1.3.10-slim), so CI cannot pass on a Bun
  # that production never runs.
  BUN_VERSION: '1.3.10'
  # ⚠ Pinned, not `stable`. An unpinned toolchain is how a green pipeline turns red on a morning
  # nobody changed anything — the same class of drift as the unpinned `cargo install` below.
  # `packages/desktop/src-tauri/rust-toolchain.toml` carries the same version for local work.
  RUST_VERSION: '1.98'

jobs:
  test-and-build:
    name: test + build (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `mongodb-memory-server` downloads a mongod on first use. Without this every run pays for
      # it, and a flaky download becomes a flaky test suite.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      # Includes `desktop-ui` (FR-14.8) — that package was NOT built by anything until
      # FR-14.34, and bit-rotted unnoticed for four days in August because of it.
      - name: Build all UIs
        run: bun run build

  clippy:
    name: clippy (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/desktop/src-tauri

      # ⚠ Installed explicitly rather than trusted to the runner image. Tauri 2's Linux build
      # needs all of these, and the image's contents are not a contract.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Clippy
        working-directory: packages/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  macos-check:
    name: cargo check (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/desktop/src-tauri

      # ⚠ `check`, not `build`, and not clippy either. macOS minutes are the expensive ones; what
      # this job is for is the platform-conditional code that only compiles on a Mac — the
      # `#[cfg(target_os = ...)]` branches Linux never sees.
      - name: Cargo check
        working-directory: packages/desktop/src-tauri
        run: cargo check --all-targets
