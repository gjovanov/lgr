name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true

# ⚠ Least privilege per job instead of a blanket write. The Windows job needs `id-token: write`
# for azure/login's OIDC exchange inside roomler's sign-windows action, and the provenance
# attestations need `attestations: write` — granting those workflow-wide would hand them to every
# job including the ones that only download artifacts.
permissions: {}

env:
  # Matches the Dockerfile's runtime (oven/bun:1.3.10-slim) and `ci.yml`.
  BUN_VERSION: '1.3.10'
  TAURI_CLI_VERSION: '2.10.1'
  # ⚠ Pinned, and the same version as `rust-toolchain.toml` and `ci.yml`. It was `@stable`, so the
  # compiler changed under the release build without a commit.
  RUST_VERSION: '1.98'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bun_target` was here too — it only ever fed the sidecar's `bun build --compile
          # --target`, which is gone with local mode (FR-14.34).
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-amd64
            bundles: deb,rpm
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}
    # ⚠ Required. The Entra federated credential is bound to this ENVIRONMENT — roomler's tenant
    # rejects wildcard tag subjects — so a job without it fails the OIDC exchange with an error
    # that reads like a signing outage rather than a missing line (FR-14.3, trap 3). The Apple and
    # GPG secrets live in this environment too.
    environment: release
    # ⚠ Without this a job runs until GitHub's 6-hour cap. On 2026-10-07 the Linux leg hung and
    # billed 361 minutes against a normal 15-24 (Windows is the slowest leg at ~39). 90 keeps more
    # than twice the slowest leg's headroom and caps a hang at a quarter of what that one cost.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write      # azure/login OIDC inside sign-windows, and provenance attestation
      attestations: write  # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/desktop/src-tauri

      # ⚠ `--locked` is THE fix for the failure that killed this pipeline. Without it,
      # `cargo install tauri-cli@2.10.1` resolves fresh dependency versions at install time, and
      # on 2026-07-20 that produced, on all three platforms:
      #   E0063: missing fields `uninstaller_header_image` … `minimum_webview2_version`
      # A green run of an unlocked `cargo install` says nothing about tomorrow, which is why this
      # sat broken for over two months. Never remove this flag.
      - name: Install Tauri CLI
        run: cargo install tauri-cli@${{ env.TAURI_CLI_VERSION }} --locked

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync version from tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#desktop-v}"
          fi
          echo "Syncing version to $VERSION"
          # Update tauri.conf.json
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" packages/desktop/src-tauri/tauri.conf.json
          rm -f packages/desktop/src-tauri/tauri.conf.json.bak
          # Update Cargo.toml
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" packages/desktop/src-tauri/Cargo.toml
          rm -f packages/desktop/src-tauri/Cargo.toml.bak
          # Update package.json
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" packages/desktop/package.json
          rm -f packages/desktop/package.json.bak
          echo "Versions updated:"
          grep '"version"' packages/desktop/src-tauri/tauri.conf.json
          grep '^version' packages/desktop/src-tauri/Cargo.toml
          grep '"version"' packages/desktop/package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # The "Compile API sidecar binary" step was here: `bun build --compile` of
      # `packages/desktop-api` into `src-tauri/binaries/lgr-api-*`, shipped as Tauri's
      # `externalBin`. Local mode is gone (FR-14.34) — there is no sidecar, no Bun runtime in the
      # app and no local database — so the app is now the Tauri shell and nothing else.

      - name: Build Desktop UI
        run: bun run build:desktop-ui

      # ── Windows: sign the inner exe BEFORE bundling, then sign the installers ─────────────
      #
      # ⚠ Two passes, and the order is the whole point. FR-14.3 requires EVERY PE to be signed,
      # and an installer is built by copying the app executable into itself — so signing only the
      # installers leaves an unsigned `LGR Desktop.exe` on every machine that installs one, which
      # is what SmartScreen and AppLocker actually judge at launch.
      #
      # Tauri's own `bundle.windows.signCommand` would be the tidy way to do this, but roomler's
      # signer is a COMPOSITE ACTION, not a CLI: it cannot be invoked from inside the bundler. So
      # the build is split, the action signs between the halves, and the second half is asserted
      # not to have undone it.
      - name: Build the app binary (no bundle)
        if: runner.os == 'Windows'
        run: cd packages/desktop && cargo tauri build --target ${{ matrix.target }} --no-bundle

      - name: Sign the app executable
        if: runner.os == 'Windows'
        id: sign-exe
        uses: gjovanov/roomler-ai/.github/actions/sign-windows@855b9279ae54e8c0985fc8572b4b15c11f94ed54
        with:
          files: packages/desktop/src-tauri/target/${{ matrix.target }}/release/lgr-desktop.exe
          mode: azure
          require: 'true'
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          description: LGR Desktop
          description-url: https://lgrai.app/

      # ⚠ **`bundle`, never `build`. This is the whole fix, and it was arrived at the hard way.**
      # `cargo tauri bundle` runs the BUNDLER ONLY — "already built by `tauri build`" — so cargo
      # is never invoked and there is nothing that can relink the signed exe. The config has no
      # `beforeBundleCommand`, so this step runs the packagers and nothing else.
      #
      # Two attempts failed here first, and both are worth not repeating:
      #   1. `--no-bundle` then `build --bundles` — `inner exe status: NotSigned`. The merged
      #      config differs between the two (`--bundles` *is* `bundle.targets`), and
      #      `tauri-build` declares `cargo:rerun-if-env-changed=TAURI_CONFIG`.
      #   2. the SAME `build --bundles` on both passes, to make the config identical — still
      #      `NotSigned`. The log shows tauri-build's `STATIC_VCRUNTIME` warning twice (a line
      #      only a build-script RUN can print) with pass two taking ~2.5 min: the script re-ran
      #      and the crate was relinked, without a full recompile. Locally, with a warm target
      #      directory, the same pair is a 0.6 s no-op — which is why this could not be settled
      #      on a developer machine and why the assertion below exists.
      #
      # ⚠ `tauri bundle --bundles` accepts only `msi` and `nsis`, which is what the Windows
      # matrix leg passes. A macOS or Linux value here would be rejected.
      - name: Bundle the installers around the signed exe
        if: runner.os == 'Windows'
        run: cd packages/desktop && cargo tauri bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # ⚠ This is the assertion the two-pass design rests on, and it has now EARNED its keep: it
      # caught the relink on the first tag that reached it, before anything shipped. Cargo
      # fingerprints its INPUTS, so an identical second invocation reports the binary fresh and
      # leaves it alone — signature and all. If that ever stops holding, cargo relinks, the
      # signature is silently gone, and the installers would ship an unsigned exe while every
      # later check still passed. Fail here instead.
      - name: Assert the signed exe survived bundling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "packages/desktop/src-tauri/target/${{ matrix.target }}/release/lgr-desktop.exe"
          $sig = Get-AuthenticodeSignature $exe
          "inner exe status: $($sig.Status)"
          "inner exe signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "The app executable is no longer signed after bundling ($($sig.Status)). Cargo relinked it, so the installers contain an UNSIGNED exe."
          }

      - name: Sign the installers
        if: runner.os == 'Windows'
        uses: gjovanov/roomler-ai/.github/actions/sign-windows@855b9279ae54e8c0985fc8572b4b15c11f94ed54
        with:
          files-folder: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: 'true'
          mode: azure
          require: 'true'
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          description: LGR Desktop installer
          description-url: https://lgrai.app/

      # ── macOS: Tauri's bundler, fed roomler's Developer ID ───────────────────────────────
      #
      # FR-14.3 allows either inline signing (as `signing-smoke.yml` does) or "through Tauri's
      # bundler fed the same credentials". The bundler is chosen here because it signs the `.app`
      # with the hardened runtime, notarises and staples in the right order, and then builds the
      # DMG around the stapled app — an order that is easy to get subtly wrong by hand, and whose
      # failure mode (a DMG containing an un-stapled app) only shows on a machine that is offline.
      #
      # ⚠ roomler's `sign-macos` action is deliberately NOT used: it is all-or-nothing on six
      # Apple secrets including the Installer certificate, and lgr holds five, because it ships a
      # DMG and not a `.pkg`.
      # Tauri wants the notarisation key as a FILE path, and it is held as base64 in a secret
      # (matching how `signing-smoke.yml` and roomler store it), so it has to be written out first.
      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          for v in KEY_P8 KEY_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is empty in the release environment"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/asc"
          chmod 700 "$RUNNER_TEMP/asc"
          echo "$KEY_P8" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Build, sign, notarise and staple (macOS)
        if: runner.os == 'macOS'
        run: cd packages/desktop && cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          # The p12 carries exactly one Developer ID Application identity; naming the type lets
          # Tauri pick it without hardcoding roomler's Team ID in this file.
          APPLE_SIGNING_IDENTITY: 'Developer ID Application'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8

      # ⚠ **Checked INSIDE the DMG, because the `.app` is gone by now.** Tauri deletes it once the
      # DMG is built, in its own words:
      #
      #     Signing …/bundle/dmg/LGR Desktop_0.1.4_aarch64.dmg
      #     Cleaning …/bundle/macos/LGR Desktop.app
      #     Finished 1 bundle at: …/bundle/dmg/LGR Desktop_0.1.4_aarch64.dmg
      #
      # This step used to point at `bundle/macos/LGR Desktop.app` and failed `No such file or
      # directory` on both macOS legs of the FIRST tag that reached it — after a successful build,
      # a successful notarisation ("Accepted") and a successful DMG. Mounting is also the better
      # check: it verifies the artifact a customer actually receives, not an intermediate.
      - name: Verify the macOS signature as Gatekeeper will
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BUNDLE="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG="$(ls "$BUNDLE"/dmg/*.dmg)"
          echo "verifying what the DMG contains: $DMG"

          MNT="$(mktemp -d)"
          # ⚠ `-nobrowse` keeps it out of Finder, and the trap detaches it even when a check below
          # fails — a left-behind mount makes the next step's `ls` ambiguous.
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT

          APP="$(ls -d "$MNT"/*.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # ⚠ Stapled INSIDE the image: a DMG whose outer signature is fine can still carry an
          # un-stapled app, and that failure only shows on a machine that is offline.
          xcrun stapler validate "$APP"
          # ⚠ The check that matters. `codesign --verify` passes on a signed-but-NOT-notarised app,
          # and such an app is refused on every customer Mac with a dialog that offers no way
          # forward. Only Gatekeeper's own verdict distinguishes them.
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q 'source=Notarized Developer ID' /tmp/spctl.txt \
            || { echo "::error::Gatekeeper did not accept the app as notarised"; exit 1; }

      - name: Remove the App Store Connect key
        if: ${{ always() && runner.os == 'macOS' }}
        run: rm -rf "$RUNNER_TEMP/asc"

      # ── Linux: a detached .asc beside every package ──────────────────────────────────────
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cd packages/desktop && cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Sign the packages with roomler's release key
        if: runner.os == 'Linux'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID:      ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          for v in GPG_PRIVATE_KEY GPG_PASSPHRASE GPG_KEY_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is empty in the release environment"; exit 1; }
          done
          export GNUPGHOME="$RUNNER_TEMP/gnupg-sign"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          BUNDLE="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          pkgs=("$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm)
          # ⚠ A tag must never publish an unsigned package, and "the glob matched nothing" is the
          # quiet way that happens.
          [ ${#pkgs[@]} -gt 0 ] || { echo "::error::no .deb/.rpm to sign"; exit 1; }
          for f in "${pkgs[@]}"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
            echo "signed: $f"
          done

          # Verify in a CLEAN keyring holding only the key roomler publishes — the check a user, and
          # the FR-14.28 updater, will actually make.
          export GNUPGHOME="$RUNNER_TEMP/gnupg-verify"
          mkdir -m 700 -p "$GNUPGHOME"
          curl -fsSL https://github.com/gjovanov/roomler-ai/releases/latest/download/roomler-release-pubkey.asc \
            | gpg --batch --import
          for f in "${pkgs[@]}"; do
            gpg --batch --status-fd 1 --verify "$f.asc" "$f" | tee "$RUNNER_TEMP/v.txt"
            grep -q '^\[GNUPG:\] VALIDSIG' "$RUNNER_TEMP/v.txt" || { echo "::error::$f.asc invalid"; exit 1; }
            primary="$(awk '/^\[GNUPG:\] VALIDSIG/ {print $NF}' "$RUNNER_TEMP/v.txt")"
            [ "$primary" = "$GPG_KEY_ID" ] || { echo "::error::$f signed by $primary, not GPG_KEY_ID"; exit 1; }
          done
          echo "all packages verified against the published roomler release key"

      # ⚠ After signing, so the attestation describes the bytes that ship. Attesting the unsigned
      # build would bind a provenance statement to a digest no user ever sees.
      #
      # ⚠ **It cannot succeed on this repository, and it must not fail the release.** The first
      # tag to get this far answered:
      #
      #     Failed to persist attestation: Feature not available for user-owned private
      #     repositories. To enable this feature, please make this repository public.
      #
      # `gjovanov/lgr` is a user-owned private repository, so the attestations API is closed to
      # it — nothing in the workflow can change that. The alternatives are to move the repo into
      # an organisation or make it public, neither of which is a release-pipeline decision. So
      # the step is allowed to fail and the next one says so out loud: signing is what protects
      # a user here, and every artifact is signed and verified above whatever this does.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      # Loud, once per leg, rather than a silently missing attestation. ⚠ If this warning ever
      # stops appearing the release notes' `gh attestation verify` line becomes true again.
      - name: Say that provenance was not attested
        if: steps.attest.outcome == 'failure'
        run: |
          echo "::warning title=No build provenance::attest-build-provenance failed on ${{ matrix.label }} - the attestations API is not available for user-owned private repositories. The artifacts are still Authenticode-signed / notarised / GPG-signed and verified in this job; only 'gh attestation verify' is unavailable."

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.asc
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.asc
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          # ⚠ `error`, not `ignore`. Each platform matches only its own bundle globs, and
          # upload-artifact complains only when NOTHING in the set matched — which is exactly the
          # case worth failing on: a build that produced no installer at all.
          if-no-files-found: error

  release:
    needs: build
    # ⚠ This was `if: always() && !cancelled()`, so a platform whose build FAILED still got a
    # release published — with that platform's installer silently missing and no error anywhere.
    # Together with the old `if-no-files-found: ignore`, a release could be published containing
    # nothing at all. A release now requires every matrix leg to have succeeded. FR-14.39 tightens
    # this further, into a draft gated on the field-lane results.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=desktop-v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "draft=${{ inputs.draft }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#desktop-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            # FR-14.39 / C20 section 3 - a tag publishes a DRAFT.
            #
            # This was `false`, so a tag published the release the updater
            # serves the moment the build went green. CI green is not evidence
            # that the thing WORKS: it is evidence that it compiles and that
            # nothing it was asked about went red. A release becomes the served
            # one only after the field lanes have run against it and a human has
            # triggered `desktop-promote.yml`, which re-checks all three
            # conditions rather than trusting a checklist.
            echo "draft=true" >> $GITHUB_OUTPUT
          fi

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" \
            -o -name "*.exe" -o -name "*.msi" -o -name "*.asc" \) -exec cp {} release/ \;
          # Publish the key the `.asc` files verify against, so "check the signature" does not
          # begin with "first find the right public key in another repository".
          curl -fsSL -o release/roomler-release-pubkey.asc \
            https://github.com/gjovanov/roomler-ai/releases/latest/download/roomler-release-pubkey.asc
          echo "Release files:"
          ls -lh release/

      # ⚠ The last gate before publishing: FR-14.3 item 5 says a missing signature must FAIL a tag.
      # Each matrix leg already refuses to finish unsigned, but this catches the case those checks
      # cannot see — a platform's artifact never arriving at all, which would otherwise publish a
      # release quietly missing an installer.
      - name: Assert every platform's signed artifacts are present
        run: |
          set -euo pipefail
          missing=()
          need() { compgen -G "release/$1" > /dev/null || missing+=("$1"); }
          need '*_x64-setup.exe'          # Windows, per-user NSIS
          need '*_x64_en-US.msi'          # Windows, per-machine MSI
          need '*aarch64.dmg'             # macOS arm64
          need '*x64.dmg'                 # macOS x64
          need '*amd64.deb'               # Linux deb
          need '*amd64.deb.asc'           #   … and its detached signature
          need '*.x86_64.rpm'             # Linux rpm
          need '*.x86_64.rpm.asc'         #   … and its detached signature
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::missing release artifact: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "all expected artifacts present"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LGR Desktop ${{ steps.version.outputs.version }}
          draft: ${{ steps.version.outputs.draft }}
          prerelease: false
          files: release/*
          body: |
            ## LGR Desktop ${{ steps.version.outputs.version }}

            A desktop client for LGR. It opens your LGR cloud app in its own window, and adds a tray, autostart and a diagnostics bundle.

            There is no local mode, no local data and no sync: the desktop needs your LGR server to be reachable.

            ### Downloads

            | Platform | File | Install scope |
            |----------|------|---------------|
            | Windows | `LGR-Desktop_${{ steps.version.outputs.version }}_x64-setup.exe` | **per-user** — no admin rights needed, updates itself |
            | Windows (managed) | `LGR-Desktop_${{ steps.version.outputs.version }}_x64_en-US.msi` | **per-machine** — for AppLocker/WDAC machines, deployed by IT; updates are IT-managed |
            | macOS (Apple Silicon) | `LGR-Desktop_${{ steps.version.outputs.version }}_aarch64.dmg` | per-user |
            | macOS (Intel) | `LGR-Desktop_${{ steps.version.outputs.version }}_x64.dmg` | per-user |
            | Linux (Debian/Ubuntu) | `lgr-desktop_${{ steps.version.outputs.version }}_amd64.deb` | per-machine |
            | Linux (Fedora/RHEL) | `lgr-desktop-${{ steps.version.outputs.version }}-1.x86_64.rpm` | per-machine |

            ⚠ On a machine with AppLocker's default rules, executables under `%LOCALAPPDATA%` are
            blocked, so the **per-user** installer is refused *by policy*. That is expected — use
            the MSI there.

            ### Verifying what you downloaded

            Everything here is signed. Nothing about LGR Desktop requires you to trust this page.

            - **Windows** — the installer and the application executable inside it are both
              Authenticode-signed. SmartScreen shows the publisher **G ROX LTD**; to check by hand:
              `signtool verify /pa /all <file>`
            - **macOS** — signed with a Developer ID, notarised by Apple and stapled, so it opens
              with no warning and without being online:
              `spctl -a -vvv "/Applications/LGR Desktop.app"` → `source=Notarized Developer ID`
            - **Linux** — each package has a detached `.asc` beside it, signed with the same release
              key `roomler-release-pubkey.asc` published in this release:
              ```
              gpg --import roomler-release-pubkey.asc
              gpg --verify lgr-desktop_*.deb.asc lgr-desktop_*.deb
              ```
            - **All platforms** — the signatures above are the guarantee. ⚠ SLSA build provenance
              is *attempted* but cannot be published from this repository (GitHub's attestations
              API is closed to user-owned private repositories), so `gh attestation verify` will
              not find a statement for these files. Each build's own run log records the commit
              and the workflow run that produced it.

            ### First Launch

            1. Open LGR Desktop
            2. Enter your LGR server address
            3. Open LGR and sign in with your normal LGR account

            ⚠ Earlier releases shipped a built-in `admin` account with a published password, for
            the local database that no longer exists. There is no default credential: the desktop
            has no accounts of its own, and you sign in to your LGR server as you do in a browser.
