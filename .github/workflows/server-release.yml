name: LGR Server

# FR-20.10 (plan step P1-7): the server a shop installs, built the way roomler-ai builds roomlerd.
#
# - **Windows:** a per-machine MSI (packages/server/wix/main.wxs). The supervisor is signed with
#   roomler's identity (G ROX LTD) through roomler's sign-windows action BEFORE the MSI is built, and
#   the MSI after. Third-party binaries (bun, mongod, Chrome, the VC++ runtime) keep their vendors'
#   own signatures.
# - **Linux:** a .deb (packages/server/packaging/nfpm.yaml) and a tarball, files owned 0:0.
# - **The update bundles** (FR-20.20, plan step P1-8): the same home as a .zip (Windows) and the
#   tarball (Linux), which a master unpacks into versions/<v>/ by itself. Each also gets a minisign
#   .sig with the desktop updater's key (FR-14.28), checked here against the updater.pub a master's
#   package carries: a master installs one only when that AND the platform signature accept it.
# - **Every asset** gets a detached .asc signed with roomler's release GPG key and a .sha256, and the
#   set gets SLSA build provenance. Signing runs on a tag or any dispatch (the `sign` job); only a
#   `server-v*` tag (or a dispatch with publish_release) publishes.
# - **The packages carry the bundle** (FR-20.20, plan step P1-8b): the MSI and the .deb install a
#   bootstrap and the bundle under installer/, and hand the bundle to `lgr-server update install-bundle`,
#   which the update helper runs too: versions/<v>/, the services pointed at it.
# - **Each package is installed before anything ships, and updated, and rolled back:** the MSI on the
#   Windows runner and the .deb under the Linux runner's own systemd. Each installs, starts, answers
#   its status, takes an update the helper confirms, takes a broken one the helper switches back from
#   on its own, offline, and uninstalls cleanly, keeping its data. The .deb also goes into clean
#   Ubuntu 22.04 and 24.04 containers (every library resolves; the supervisor starts its database and
#   API as the lgr user).
# - **The image** (FR-20.12, gjovanov/lgr#367): the .deb's home in an image, for Compose and
#   Kubernetes (packages/server/packaging/docker/). Run as Compose runs it before anything ships; a
#   release carries it as a .tar.zst (air-gapped `docker load`) with its compose and k8s files, and
#   pushes it to ghcr.io/gjovanov/lgr-server:<version>.
#
# A pull request that touches any of it builds it unsigned and installs it.

on:
  push:
    tags: ['server-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, equal to packages/server/Cargo.toml (N.N.N)'
        required: true
      publish_release:
        description: 'Publish the GitHub release'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'packages/server/**'
      - 'scripts/assemble-server-home.ts'
      - 'scripts/fetch-server-runtime.ts'
      - 'scripts/fetch-pdf-browser.ts'
      - 'scripts/build-server.ts'
      - 'scripts/lib/server-package.ts'
      - '.github/workflows/server-release.yml'

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      sign: ${{ steps.v.outputs.sign }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        env:
          # Through the environment, never interpolated into the script: `version` is a free string.
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          CARGO="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/server/Cargo.toml | head -1)"
          case "$GITHUB_EVENT_NAME" in
            push)              VERSION="${GITHUB_REF#refs/tags/server-v}"; RELEASE=true ;;
            workflow_dispatch) VERSION="$INPUT_VERSION"; RELEASE="$INPUT_PUBLISH" ;;
            *)                 VERSION="$CARGO"; RELEASE=false ;;
          esac
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$VERSION' is not N.N.N"; exit 1; }
          [ "$VERSION" = "$CARGO" ] || { echo "::error::version $VERSION is not packages/server/Cargo.toml's $CARGO"; exit 1; }
          # A pull request builds unsigned; everything else is signed, and fails if it cannot be.
          SIGN=$([ "$GITHUB_EVENT_NAME" = pull_request ] && echo false || echo true)
          { echo "version=$VERSION"; echo "tag=server-v$VERSION"; echo "release=$RELEASE"; echo "sign=$SIGN"; } >> "$GITHUB_OUTPUT"
          echo "version $VERSION, release $RELEASE, sign $SIGN"

  # The API and its UIs: one bundle for every platform (`bun run build:server`), checked.
  package:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:server
      - run: bun run check:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-package
          path: dist/lgr-server
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [version, package]
    runs-on: windows-latest
    # ⚠ The Azure federated credential trusts this environment's subject, not a tag: every job that
    # signs with Azure carries it (roomler's lesson).
    environment: release
    permissions:
      contents: read
      id-token: write   # azure/login's OIDC inside sign-windows
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # The Chrome fetcher resolves puppeteer's pin from packages/reporting.
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/server
      - name: Build the supervisor
        # ⚠ Static CRT. The MSI's InstallVersion runs the installer's own lgr-server.exe before any
        # version is unpacked, so it must not need the MSVC runtime (vcruntime140.dll): a clean Windows
        # has none. server-v0.1.0 linked it dynamically, and the first field lane (vmtest T-3, a clean
        # Win11) failed the install with 1603, STATUS_DLL_NOT_FOUND. This runner HAS the runtime, so the
        # install below passed regardless; the next step is what catches it here. roomler's standalone
        # EXEs do the same (field report 2026-07-28).
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --manifest-path packages/server/Cargo.toml
      - name: The supervisor and the MSI's check need no C runtime
        shell: pwsh
        run: |
          # The IMPORT TABLE, never a scan for DLL names: the binary also names vcruntime140.dll and
          # msvcp140.dll as data (the runtime files it carries for mongod), which a scan cannot tell
          # from an import. The custom action DLL (FR-20.13) runs inside msiexec on the same clean
          # machine, before anything is installed.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Error 'no dumpbin on this runner'; exit 1 }
          foreach ($bin in 'lgr-server.exe', 'lgr_server_msi.dll') {
            $deps = (& $dumpbin /nologo /dependents "packages/server/target/release/$bin") -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
            "$bin imports: $($deps -join ', ')"
            $crt = $deps | Where-Object { $_ -match '^(?i)(vcruntime140(_1)?|msvcp140(_\d)?|ucrtbase|api-ms-win-crt-.+)\.dll$' }
            if ($crt) { Write-Error "$bin imports the C runtime, which a clean Windows does not have: $($crt -join ', ')"; exit 1 }
            "$bin imports no C runtime"
          }
          # The installer calls it by this name (DllEntry="Preflight").
          $exports = (& $dumpbin /nologo /exports packages/server/target/release/lgr_server_msi.dll) -join "`n"
          if ($exports -notmatch '(?m)\sPreflight\s*$') { Write-Error "lgr_server_msi.dll does not export Preflight:`n$exports"; exit 1 }
          'lgr_server_msi.dll exports Preflight'

      # ⚠ Signed BEFORE the MSI is built, and no step after this one runs cargo.
      - name: Sign the supervisor
        uses: gjovanov/roomler-ai/.github/actions/sign-windows@855b9279ae54e8c0985fc8572b4b15c11f94ed54
        with:
          files: packages/server/target/release/lgr-server.exe,packages/server/target/release/lgr_server_msi.dll
          mode: ${{ needs.version.outputs.sign == 'true' && 'azure' || 'off' }}
          require: ${{ needs.version.outputs.sign }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          description: LGR Server
          description-url: https://lgrai.app/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-package
          path: dist/lgr-server

      # mongod.exe links the VC++ runtime: shipped app-local beside it, from the runner's own
      # Visual Studio redistributable (roomler's way).
      - name: Find the VC++ runtime
        id: crt
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "no VC++ CRT redistributable under $vs" }
          foreach ($d in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') { if (-not (Test-Path "$($crt.FullName)\$d")) { throw "$d missing in $($crt.FullName)" } }
          "dir=$($crt.FullName)" >> $env:GITHUB_OUTPUT

      - name: Assemble the home
        run: bun scripts/assemble-server-home.ts --target windows-x64 --version ${{ env.VERSION }} --server-bin packages/server/target/release/lgr-server.exe --package dist/lgr-server --crt "${{ steps.crt.outputs.dir }}" --out dist/home

      # FR-20.20 (plan step P1-8): the UPDATE BUNDLE a master installs by itself into versions/<v>/:
      # the same home the MSI carries (its lgr-server.exe already signed), under one top-level
      # directory. The release job signs it twice (minisign with the updater key, GPG with roomler's).
      - name: The update bundle
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "lgr-server-$env:VERSION-x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP 'bundle'
          New-Item -ItemType Directory -Force "$stage\$name" | Out-Null
          Copy-Item -Recurse -Force dist\home\* "$stage\$name"
          # Windows' own bsdtar writes a zip (-a, from the suffix); GNU tar on PATH cannot.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "out\$name.zip" -C $stage $name
          if ($LASTEXITCODE) { throw 'zip failed' }
          & "$env:SystemRoot\System32\tar.exe" -t -f "out\$name.zip" | Select-Object -First 5
          "{0:N0} MB" -f ((Get-Item "out\$name.zip").Length / 1MB)
          "path=out\$name.zip" >> $env:GITHUB_OUTPUT

      # FR-20.20 (P1-8b): the MSI carries the bootstrap and that bundle, nothing else; its action hands
      # the bundle to `update install-bundle`, which lays out versions\<v>\.
      - name: Build the MSI
        id: msi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (-not (Test-Path "$wix\candle.exe")) {
            choco install -y --no-progress wixtoolset --version 3.14.1
            if (-not (Test-Path "$wix\candle.exe")) { throw "WiX v3.14 is not at $wix" }
          }
          $exe = (Resolve-Path dist/home/lgr-server.exe).Path
          $bundle = (Resolve-Path '${{ steps.bundle.outputs.path }}').Path
          # FR-20.13: the machine check, signed with the supervisor above.
          $preflight = (Resolve-Path packages/server/target/release/lgr_server_msi.dll).Path
          New-Item -ItemType Directory -Force wixobj | Out-Null
          & "$wix\candle.exe" -nologo -arch x64 "-dVersion=$env:VERSION" "-dServerExe=$exe" "-dBundle=$bundle" "-dPreflightDll=$preflight" -out wixobj\ packages/server/wix/main.wxs
          if ($LASTEXITCODE) { throw 'candle failed' }
          $msi = "out\lgr-server-$env:VERSION-x86_64-pc-windows-msvc.msi"
          & "$wix\light.exe" -nologo -spdb -out $msi (Get-ChildItem wixobj\*.wixobj).FullName
          if ($LASTEXITCODE) { throw 'light failed' }
          "path=$msi" >> $env:GITHUB_OUTPUT
          "{0:N0} MB" -f ((Get-Item $msi).Length / 1MB)

      - name: Sign the MSI
        uses: gjovanov/roomler-ai/.github/actions/sign-windows@855b9279ae54e8c0985fc8572b4b15c11f94ed54
        with:
          files: ${{ steps.msi.outputs.path }}
          mode: ${{ needs.version.outputs.sign == 'true' && 'azure' || 'off' }}
          require: ${{ needs.version.outputs.sign }}
          expect-subject-contains:  ${{ vars.AZURE_SIGNING_EXPECT_SUBJECT }}
          endpoint:                 ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-client-id:          ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id:          ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id:    ${{ vars.AZURE_SUBSCRIPTION_ID }}
          description: LGR Server
          description-url: https://lgrai.app/

      # The MSI, installed for real: both services, their accounts, the version laid out and pointed at,
      # the firewall rule; it starts and answers. Then FR-20.20's lane: an update the helper confirms, a
      # broken one it switches back from by itself, from disk, and the broken one refused for good. Then
      # it uninstalls, and leaves the data.
      - name: Install, update, roll back and uninstall the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path '${{ steps.msi.outputs.path }}').Path
          $root = "$env:ProgramFiles\LGR Server"
          $exe = "$root\installer\lgr-server.exe"
          function Logs { Get-Content "$root\update\helper.log" -Tail 60 -ErrorAction SilentlyContinue; Get-Content "$env:ProgramData\LGR\logs\lgr-server.log" -Tail 60 -ErrorAction SilentlyContinue }
          function Fail($what) { Logs; throw $what }
          function State { Get-Content "$root\update\state.json" -Raw | ConvertFrom-Json }
          function Image($name) { (Get-CimInstance Win32_Service -Filter "Name='$name'").PathName }
          function ApiUp($secs) {
            for ($i = 0; $i -lt $secs / 3; $i++) {
              $s = & $exe status --json 2>$null | ConvertFrom-Json -ErrorAction SilentlyContinue
              if ($s -and ($s.children | Where-Object { $_.name -eq 'api' -and $_.state -eq 'running' })) { return $true }
              Start-Sleep 3
            }
            return $false
          }
          function Until($what, $secs, [scriptblock]$ok) {
            for ($i = 0; $i -lt $secs / 5; $i++) { if (& $ok) { return }; Start-Sleep 5 }
            Fail "timed out: $what"
          }
          # A bundle of this home under another version: HOME.json says so (and counts what is in it).
          function Bundle($v, [scriptblock]$change) {
            $name = "lgr-server-$v-x86_64-pc-windows-msvc"
            $stage = Join-Path $env:RUNNER_TEMP "b-$v"
            New-Item -ItemType Directory -Force "$stage\$name" | Out-Null
            Copy-Item -Recurse -Force dist\home\* "$stage\$name"
            if ($change) { & $change "$stage\$name" }
            $m = Get-Content "$stage\$name\HOME.json" -Raw | ConvertFrom-Json
            $files = Get-ChildItem -Recurse -File -Force "$stage\$name"
            $m.version = $v
            $m.files = [int64]$files.Count
            # [int64]: Measure-Object sums to a double, which ConvertTo-Json writes as "1.0" and HOME.json never holds.
            $m.bytes = [int64]($files | Where-Object { $_.FullName -ne "$stage\$name\HOME.json" } | Measure-Object Length -Sum).Sum
            $m | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$stage\$name\HOME.json"
            & "$env:SystemRoot\System32\tar.exe" -a -c -f "$stage.zip" -C $stage $name
            if ($LASTEXITCODE) { throw "bundling $v failed" }
            return "$stage.zip"
          }
          $parts = $env:VERSION.Split('.')
          $v1 = $env:VERSION
          $v2 = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          $v3 = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 2)"

          # 1. Install.
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 120; throw "install failed: $($p.ExitCode)" }
          # FR-20.13: the machine check ran before anything was installed, and wrote every verdict to
          # the log. (Its refusals are proven on machines below the floor: vmtest's `refused` lanes.)
          # Get-Content: it reads the log's BOM, whichever encoding msiexec chose.
          $checked = @(Get-Content install.log | ForEach-Object { if ($_ -match 'LGR Server preflight: (ok|FAIL) (\S+)') { "$($Matches[1]) $($Matches[2])" } })
          $missing = @('cpu', 'memory', 'disk', 'location' | Where-Object { "ok $_" -notin $checked })
          if ($missing.Count) { Fail "the install log's machine check lacks a passing $($missing -join ', '): $($checked -join '; ')" }
          foreach ($f in 'installer\lgr-server.exe', 'installer\lgr-server-bundle.zip', "versions\$v1\lgr-server.exe", "versions\$v1\HOME.json", "versions\$v1\bin\bun.exe", "versions\$v1\bin\mongod.exe", "versions\$v1\bin\vcruntime140.dll", "versions\$v1\package\server-manifest.json", "versions\$v1\chrome\chrome-headless-shell.exe", "versions\$v1\licences\mongodb\LICENSE-Community.txt") {
            if (-not (Test-Path "$root\$f")) { Fail "not installed: $f" }
          }
          # The preflight finds mongod's runtime in the version's bin\: this runner also has it in
          # System32, which a clean Windows does not. Asked of the installer's copy, as an operator asks.
          $vc = & $exe preflight --json | ConvertFrom-Json | Where-Object { $_.name -eq 'vc-runtime' }
          if (-not $vc.ok -or $vc.detail -notlike "*ships with the server*\versions\$v1\bin*") { Fail "the preflight's runtime check: $($vc | ConvertTo-Json -Compress)" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='LGRServer'"
          if (-not $svc) { Fail 'no LGRServer service' }
          if ($svc.StartName -ne 'NT SERVICE\LGRServer') { Fail "the service runs as $($svc.StartName)" }
          if ($svc.StartMode -ne 'Auto') { Fail "the service starts $($svc.StartMode)" }
          if ($svc.PathName -notlike "*\versions\$v1\lgr-server.exe*") { Fail "the service runs $($svc.PathName)" }
          $helper = Get-CimInstance Win32_Service -Filter "Name='LGRServerUpdate'"
          if (-not $helper) { Fail 'no update helper' }
          if ($helper.StartName -ne 'LocalSystem') { Fail "the helper runs as $($helper.StartName)" }
          if ($helper.PathName -notlike "*\versions\$v1\lgr-server.exe*update-helper*") { Fail "the helper runs $($helper.PathName)" }
          # The service account may start the helper, and nothing more (the SID Windows computes).
          $sid = ((& sc.exe showsid LGRServer) -match 'SERVICE SID:' | Select-Object -First 1) -replace '.*SERVICE SID:\s*', ''
          $sddl = ((& sc.exe sdshow LGRServerUpdate) | Where-Object { $_ }) -join ''
          if ($sddl -notlike "*(A;;LCRP;;;$($sid.Trim()))*") { Fail "the helper's DACL: $sddl (service SID $sid)" }
          $rule = Get-NetFirewallRule -DisplayName 'LGR Server (LAN)'
          if ($rule.Profile -ne 'Any') { Fail "the firewall rule covers $($rule.Profile)" }
          $addr = ($rule | Get-NetFirewallAddressFilter).RemoteAddress
          if ("$addr" -ne 'LocalSubnet') { Fail "the firewall rule admits $addr" }
          function RuleProgram { (Get-NetFirewallRule -DisplayName 'LGR Server (LAN)' | Get-NetFirewallApplicationFilter).Program }
          if ((RuleProgram) -notlike "*\versions\$v1\lgr-server.exe") { Fail "the firewall rule names $(RuleProgram)" }
          $st = State
          if ($st.current -ne $v1 -or $st.lastKnownGood -ne $v1 -or $st.attempting) { Fail "the state after the install: $($st | ConvertTo-Json -Compress)" }
          Until 'the service runs' 180 { (Get-Service LGRServer).Status -eq 'Running' }
          if (-not (ApiUp 180)) { Fail 'the API did not come up under the service' }
          & $exe status
          & $exe update status
          # FR-20.20: the backup a switch takes first, through the supervisor's IPC and the API's socket.
          $out = & $exe backup now
          if ($LASTEXITCODE) { Fail "backup now failed: $out" }
          if ("$out" -notlike '*nothing to back up*') { Fail "backup now said: $out" }

          # The helper's watch, in minutes rather than the real 5/20 (SYSTEM's file; Administrators may write it).
          '{ "cleanSecs": 30, "deadlineSecs": 180, "downSecs": 60 }' | Set-Content -Encoding ascii "$root\update\helper.json"

          # 2. An update the helper confirms.
          $b2 = Bundle $v2 $null
          & $exe update install-bundle $b2 --start
          if ($LASTEXITCODE) { Fail "installing $v2 failed" }
          $st = State
          if ($st.current -ne $v2 -or $st.attempting.version -ne $v2 -or $st.attempting.from -ne $v1) { Fail "the attempt: $($st | ConvertTo-Json -Compress)" }
          if ((Image LGRServerUpdate) -notlike "*\versions\$v1\*") { Fail 'the helper must run the known good version while it watches' }
          Until "$v2 confirmed" 420 { $s = State; $s.lastKnownGood -eq $v2 -and -not $s.attempting }
          $st = State
          if ($st.previous -ne $v1) { Fail "the previous version: $($st.previous)" }
          if ((Image LGRServer) -notlike "*\versions\$v2\*") { Fail "the service runs $(Image LGRServer)" }
          if ((Image LGRServerUpdate) -notlike "*\versions\$v2\*") { Fail "the helper runs $(Image LGRServerUpdate)" }
          if ((RuleProgram) -notlike "*\versions\$v2\lgr-server.exe") { Fail "the firewall rule names $(RuleProgram)" }
          if (-not (ApiUp 120)) { Fail "the API is not up on $v2" }
          "confirmed $v2"

          # 3. A broken update: the API's entry throws, so it never runs cleanly. The helper switches back.
          $b3 = Bundle $v3 { param($d) Set-Content -Encoding ascii "$d\package\app\server.js" "throw new Error('a broken release, on purpose')" }
          & $exe update install-bundle $b3 --start
          if ($LASTEXITCODE) { Fail "installing $v3 failed" }
          Until "$v3 rolled back" 600 { $s = State; $s.current -eq $v2 -and -not $s.attempting -and ($s.failed | Where-Object { $_.version -eq $v3 }) }
          if ((Image LGRServer) -notlike "*\versions\$v2\*") { Fail "after the rollback the service runs $(Image LGRServer)" }
          if ((RuleProgram) -notlike "*\versions\$v2\lgr-server.exe") { Fail "after the rollback the firewall rule names $(RuleProgram)" }
          Until 'the API back up' 300 { ApiUp 3 }
          (State).failed | Format-Table -AutoSize | Out-String | Write-Host
          # Refused for good, and nothing moves.
          & $exe update install-bundle $b3
          if ((State).current -ne $v2) { Fail "the failed version was switched to again" }
          "rolled back from $v3 to $v2, offline"

          # 4. Uninstall: both services, the firewall rule and every version go; the data stays.
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart', '/l*v', 'uninstall.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 120; throw "uninstall failed: $($p.ExitCode)" }
          foreach ($n in 'LGRServer', 'LGRServerUpdate') { if (Get-CimInstance Win32_Service -Filter "Name='$n'") { throw "$n is still registered" } }
          if (Get-NetFirewallRule -DisplayName 'LGR Server (LAN)' -ErrorAction SilentlyContinue) { throw 'the firewall rule is still there' }
          if (Test-Path "$root\versions") { throw 'the versions are still there' }
          if (Test-Path "$root\installer\lgr-server.exe") { throw 'the files are still there' }
          if (-not (Test-Path "$env:ProgramData\LGR\keys")) { throw 'the uninstall removed the data' }
          'installed, updated, rolled back, uninstalled; the data stayed'

      - name: Checksum
        shell: bash
        run: cd out && for f in *.msi *.zip; do sha256sum "$f" | awk '{print $1"  "$2}' > "$f.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: out/
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: [version, package]
    # 22.04: the glibc floor the binaries are built against (2.35), as roomler does.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NFPM_VERSION: 2.43.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # The Chrome fetcher resolves puppeteer's pin from packages/reporting.
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/server
      - name: Build the supervisor
        run: cargo build --release --locked --manifest-path packages/server/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-package
          path: dist/lgr-server
      - name: Assemble the home
        run: bun scripts/assemble-server-home.ts --target linux-x64 --version "$VERSION" --server-bin packages/server/target/release/lgr-server --package dist/lgr-server --out dist/home

      - name: The tarball
        run: |
          set -euo pipefail
          mkdir -p out
          name="lgr-server-$VERSION-x86_64-unknown-linux-gnu"
          tar --owner=0 --group=0 --numeric-owner --transform "s,^home,$name," -czf "out/$name.tar.gz" -C dist home
          # sed, not head: head leaves early, tar gets SIGPIPE, and pipefail fails the step.
          tar tzf "out/$name.tar.gz" | sed -n "1,5p"

      - name: The .deb
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          grep " nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c -
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          # FR-20.20 (P1-8b): the bootstrap and the bundle, which the postinst installs as a version.
          mkdir -p dist/installer
          cp dist/home/lgr-server dist/installer/lgr-server
          cp "out/lgr-server-$VERSION-x86_64-unknown-linux-gnu.tar.gz" dist/installer/lgr-server-bundle.tar.gz
          VERSION="$VERSION" ARCH=amd64 ./nfpm package -f packages/server/packaging/nfpm.yaml -p deb -t "out/lgr-server_${VERSION}_amd64.deb"
          dpkg-deb --info "out/lgr-server_${VERSION}_amd64.deb"

      # Installed in clean containers: apt resolves the dependencies, every library the binaries
      # link is found, and the supervisor brings up its database and API as the lgr user.
      # /var/lib/lgr is a volume, as in the image: a container's own layer is overlayfs, where the
      # installer and the server both refuse the data (it is gone with the container, FR-20.12).
      - name: Install the .deb on Ubuntu 22.04 and 24.04
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm -e VERSION="$VERSION" -v "$PWD/out:/out:ro" --mount type=volume,dst=/var/lib/lgr "$image" bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /out/*.deb >/dev/null
              # The postinst installed the bundle as a version and pointed current at it.
              test "$(readlink /opt/lgr-server/current)" = "versions/$VERSION"
              test "$(readlink /opt/lgr-server/lkg)" = "versions/$VERSION"
              for b in /opt/lgr-server/current/lgr-server /opt/lgr-server/current/bin/mongod /opt/lgr-server/current/bin/bun /opt/lgr-server/current/chrome/chrome-headless-shell; do
                if ldd "$b" | grep "not found"; then echo "unresolved libraries in $b"; exit 1; fi
              done
              lgr-server --version
              /opt/lgr-server/current/bin/mongod --version | head -1
              id lgr
              test "$(stat -c "%U %a" /var/lib/lgr)" = "lgr 750"
              test "$(stat -c "%U %a" /opt/lgr-server/current/lgr-server)" = "root 755"
              test "$(stat -c "%U %a" /opt/lgr-server/update)" = "root 755"
              mkdir -p /run/lgr-server && chown lgr:lgr /run/lgr-server
              su -s /bin/sh lgr -c "LGR_SERVER_DATA=/var/lib/lgr /opt/lgr-server/current/lgr-server run >/tmp/run.log 2>&1 &"
              for i in $(seq 1 60); do
                # -z: the status is pretty-printed, so "name" and "state" are on different lines.
                if su -s /bin/sh lgr -c "lgr-server status --json" 2>/dev/null | grep -qz "\"name\": *\"api\"[^}]*\"state\": *\"running\""; then ok=1; break; fi
                sleep 3
              done
              su -s /bin/sh lgr -c "lgr-server status" || true
              if [ -z "${ok:-}" ]; then tail -80 /tmp/run.log; exit 1; fi
              echo "the API came up under lgr-server"
            '
            echo "::endgroup::"
          done

      # FR-20.20 under the runner's own systemd: the .deb installed for real, an update the helper
      # (pulled in by the service's start) confirms, a broken one it switches back from by itself, and
      # a removal that takes every version and leaves the data.
      - name: Install, update, roll back and remove the .deb under systemd
        run: |
          set -euo pipefail
          root=/opt/lgr-server
          logs() { sudo journalctl -u lgr-server -u lgr-server-update --no-pager -n 120 || true; }
          fail() { echo "::error::$1"; logs; exit 1; }
          state() { sudo cat $root/update/state.json; }
          field() { state | jq -r "$1"; }
          api_up() { for i in $(seq 1 "$(( $1 / 3 ))"); do if sudo lgr-server status --json 2>/dev/null | jq -e '.children[] | select(.name == "api" and .state == "running")' >/dev/null; then return 0; fi; sleep 3; done; return 1; }
          until_() { local what=$1 secs=$2; shift 2; for i in $(seq 1 "$(( secs / 5 ))"); do if "$@"; then return 0; fi; sleep 5; done; fail "timed out: $what"; }
          bundle() {
            local v=$1 change=${2:-} name="lgr-server-$1-x86_64-unknown-linux-gnu" stage="$RUNNER_TEMP/b-$1"
            mkdir -p "$stage" && cp -a dist/home "$stage/$name"
            if [ -n "$change" ]; then "$change" "$stage/$name"; fi
            local files bytes
            files=$(find -L "$stage/$name" -type f | wc -l)
            # -L: a link counts as what it points at, as the release's own count does.
            bytes=$(find -L "$stage/$name" -type f ! -path "$stage/$name/HOME.json" -printf '%s\n' | awk '{s+=$1} END {print s+0}')
            jq --arg v "$v" --argjson f "$files" --argjson b "$bytes" '.version = $v | .files = $f | .bytes = $b' "$stage/$name/HOME.json" > "$stage/HOME.json" && mv "$stage/HOME.json" "$stage/$name/HOME.json"
            tar --owner=0 --group=0 --numeric-owner -czf "$stage.tar.gz" -C "$stage" "$name"
            echo "$stage.tar.gz"
          }
          broken() { echo "throw new Error('a broken release, on purpose')" > "$1/package/app/server.js"; }
          IFS=. read -r major minor patch <<< "$VERSION"
          v1=$VERSION; v2="$major.$minor.$((patch + 1))"; v3="$major.$minor.$((patch + 2))"

          # The runner image's package lists go stale; the .deb's dependencies (poppler, tesseract) are fetched.
          sudo apt-get update -qq
          sudo apt-get install -y -qq "./out/lgr-server_${VERSION}_amd64.deb" >/dev/null
          test "$(readlink $root/current)" = "versions/$v1" || fail "current is $(readlink $root/current)"
          sudo systemctl start lgr-server
          api_up 240 || fail "the API did not come up under systemd"
          # FR-20.88 (P2-6c): the package pulled in poppler and tesseract with Bulgarian, and the
          # master's own reader runs on them: a text layer as the sidecar reads it, and a scan.
          tesseract --list-langs 2>/dev/null | grep -qx bul || fail "the package did not bring tesseract's Bulgarian"
          (cd packages/tests && LGR_EXPECT_LOCAL_TOOLS=1 bun test src/integration/local-extract.flow.test.ts) || fail "the master's own PDF reader failed"
          [ "$(field .current)" = "$v1" ] && [ "$(field .lastKnownGood)" = "$v1" ] || fail "the state after the install: $(state)"
          # FR-20.20: the backup a switch takes first, through the supervisor's IPC and the API's socket.
          sudo lgr-server backup now | tee "$RUNNER_TEMP/backup.txt" || fail "backup now failed"
          grep -q "nothing to back up" "$RUNNER_TEMP/backup.txt" || fail "backup now said: $(cat "$RUNNER_TEMP/backup.txt")"
          echo '{ "cleanSecs": 30, "deadlineSecs": 180, "downSecs": 60 }' | sudo tee $root/update/helper.json >/dev/null

          b2=$(bundle "$v2")
          sudo $root/installer/lgr-server update install-bundle "$b2" --start
          [ "$(field .attempting.version)" = "$v2" ] && [ "$(field .attempting.from)" = "$v1" ] || fail "the attempt: $(state)"
          test "$(readlink $root/lkg)" = "versions/$v1" || fail "the helper must run the known good version while it watches"
          until_ "$v2 confirmed" 420 sh -c "sudo cat $root/update/state.json | jq -e '.lastKnownGood == \"$v2\" and .attempting == null' >/dev/null"
          test "$(readlink $root/current)" = "versions/$v2" && test "$(readlink $root/lkg)" = "versions/$v2" || fail "the pointers after the confirmation"
          [ "$(field .previous)" = "$v1" ] || fail "the previous version: $(field .previous)"
          api_up 120 || fail "the API is not up on $v2"
          echo "confirmed $v2"

          b3=$(bundle "$v3" broken)
          sudo $root/installer/lgr-server update install-bundle "$b3" --start
          until_ "$v3 rolled back" 600 sh -c "sudo cat $root/update/state.json | jq -e '.current == \"$v2\" and .attempting == null and any(.failed[]; .version == \"$v3\")' >/dev/null"
          test "$(readlink $root/current)" = "versions/$v2" || fail "after the rollback current is $(readlink $root/current)"
          until_ "the API back up" 300 api_up 3
          sudo $root/installer/lgr-server update install-bundle "$b3"
          [ "$(field .current)" = "$v2" ] || fail "the failed version was switched to again"
          sudo lgr-server update status
          echo "rolled back from $v3 to $v2, offline"

          sudo apt-get remove -y -qq lgr-server >/dev/null
          test ! -e $root/versions || fail "the versions are still there"
          test ! -e /usr/lib/systemd/system/lgr-server.service || fail "the unit is still there"
          ! systemctl is-active --quiet lgr-server || fail "the service still runs"
          sudo test -d /var/lib/lgr/keys || fail "the removal took the data"
          echo "installed, updated, rolled back, removed; the data stayed"

      - name: Checksums
        run: cd out && for f in *.deb *.tar.gz; do sha256sum "$f" | awk '{print $1"  "$2}' > "$f.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: out/
          if-no-files-found: error
          retention-days: 14

  # FR-20.12 (gjovanov/lgr#367, option A): a master from Compose or Kubernetes is the .deb's own home
  # in an image (packages/server/packaging/docker/), built from the .deb the linux job made and run
  # here the way Compose runs it: the host's network, one volume, the supervisor under tini. A tag or
  # a dispatch saves it for the sign job (a release asset, and what the field lanes `docker load`
  # air-gapped) with its compose and k8s files; image-publish pushes a published release to GHCR.
  image:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/gjovanov/lgr-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux
          path: out
      - name: Build the image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          cp "out/lgr-server_${VERSION}_amd64.deb" "$RUNNER_TEMP/image/lgr-server.deb"
          DOCKER_BUILDKIT=1 docker build --build-arg VERSION="$VERSION" -t "$IMAGE:$VERSION" -f packages/server/packaging/docker/Dockerfile "$RUNNER_TEMP/image"
          docker image inspect "$IMAGE:$VERSION" --format '{{.Size}}' | awk '{ printf "the image: %.0f MB\n", $1 / 1048576 }'

      # Before anything ships: the machine check reads the CONTAINER (its memory limit; data on its
      # own layer refused, and the server not started there), then the image runs as Compose runs it.
      # It comes up healthy, its setup console answers on the host's loopback and the link's token
      # opens it, mongod and the console listen on loopback only, `update apply` says an image is
      # updated by its tag and so does the status, `docker stop` is the service's own graceful stop,
      # and it comes back on the same volume with its database clean.
      - name: Run the image as Compose runs it
        run: |
          set -euo pipefail
          img="$IMAGE:$VERSION"
          logs() { docker logs --tail 150 lgr-smoke 2>&1 || true; docker exec lgr-smoke sh -c 'tail -n 60 /var/lib/lgr/logs/api.log /var/lib/lgr/logs/mongod.log' 2>/dev/null || true; }
          fail() { echo "::error::$1"; logs; exit 1; }
          healthy() { for _ in $(seq 1 "$(( $1 / 5 ))"); do [ "$(docker inspect -f '{{.State.Health.Status}}' lgr-smoke 2>/dev/null)" = healthy ] && return 0; sleep 5; done; return 1; }
          # check <name> <jq condition>, on a preflight --json read from stdin.
          check() { jq -e --arg n "$1" ".[] | select(.name == \$n) | $2" >/dev/null; }

          docker run --rm "$img" --version
          docker run --rm --memory 2g "$img" preflight --json > "$RUNNER_TEMP/pf-2g.json" || true
          check memory '.ok == false and (.detail | contains("memory limit"))' < "$RUNNER_TEMP/pf-2g.json" || fail "a 2 GB container passed the memory check: $(cat "$RUNNER_TEMP/pf-2g.json")"
          docker run --rm --memory 6g "$img" preflight --json > "$RUNNER_TEMP/pf-6g.json" || true
          check memory '.ok == true' < "$RUNNER_TEMP/pf-6g.json" || fail "a 6 GB container failed the memory check: $(cat "$RUNNER_TEMP/pf-6g.json")"
          docker run --rm -e LGR_SERVER_DATA=/home/lgr-layer "$img" preflight --json > "$RUNNER_TEMP/pf-layer.json" || true
          check location '.ok == false and (.detail | contains("overlayfs"))' < "$RUNNER_TEMP/pf-layer.json" || fail "data on the container's own layer passed: $(cat "$RUNNER_TEMP/pf-layer.json")"
          code=0; timeout 120 docker run --rm -e LGR_SERVER_DATA=/home/lgr-layer "$img" || code=$?
          [ "$code" = 7 ] || fail "the server did not refuse its data on the container's own layer (exit $code)"

          docker volume create lgr-smoke >/dev/null
          docker run -d --name lgr-smoke --network host -e TZ=Europe/Sofia --mount source=lgr-smoke,target=/var/lib/lgr "$img" >/dev/null
          healthy 300 || fail "the image did not come up healthy"
          docker exec lgr-smoke lgr-server status
          # (preflight exits 7 when any check fails, e.g. a runner's disk below the 20 GB floor)
          docker exec lgr-smoke lgr-server preflight --json > "$RUNNER_TEMP/pf-volume.json" || true
          check location '.ok == true' < "$RUNNER_TEMP/pf-volume.json" || fail "its volume failed the location check: $(cat "$RUNNER_TEMP/pf-volume.json")"

          link="$(docker exec lgr-smoke lgr-server setup-token | grep -o 'http://127\.0\.0\.1:[0-9]*/__lgr/setup#[^[:space:]]*' | head -1)"
          [ -n "$link" ] || fail "setup-token printed no link"
          base="${link%%/__lgr/*}"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/__lgr/setup")" = 200 ] || fail "the setup console does not answer on the host's loopback"
          opened="$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "{\"token\":\"${link#*#}\"}" "$base/__lgr/setup/session")"
          [ "$opened" = 204 ] || fail "the setup link's token did not open a session ($opened)"
          ss -ltnH | awk '{print $4}' | grep -E ':(27118|4480)$' || fail "mongod or the console is not listening"
          if ss -ltnH | awk '{print $4}' | grep -E ':(27118|4480)$' | grep -vE '^(127\.0\.0\.1|\[::1\]):'; then fail "mongod or the setup console listens beyond loopback"; fi

          out="$(docker exec lgr-smoke lgr-server update apply /tmp/x.tar.gz --sig /tmp/x.sig --asc /tmp/x.asc 2>&1)" && fail "update apply ran in a container: $out"
          grep -q "runs from the image $IMAGE" <<< "$out" || fail "update apply said: $out"
          state=""
          for _ in $(seq 1 36); do state="$(docker exec lgr-smoke lgr-server status --json | jq -r '.update.state // empty')"; [ -n "$state" ] && break; sleep 5; done
          [ "$state" = image ] || fail "the update status is '$state', not image"

          start=$(date +%s); docker stop -t 30 lgr-smoke >/dev/null; took=$(( $(date +%s) - start ))
          exited="$(docker inspect -f '{{.State.ExitCode}}' lgr-smoke)"
          [ "$exited" = 0 ] || fail "the supervisor exited $exited on SIGTERM"
          [ "$took" -lt 30 ] || fail "docker stop took $took s: the stop was not the graceful one"
          docker start lgr-smoke >/dev/null
          healthy 300 || fail "the image did not come back on its volume"
          if docker exec lgr-smoke grep -qi 'unclean shutdown' /var/lib/lgr/logs/mongod.log; then fail "mongod was not stopped cleanly"; fi
          echo "stopped in $took s, and back on its volume"
          docker rm -f lgr-smoke >/dev/null && docker volume rm lgr-smoke >/dev/null

      - name: The image and its Compose and k8s files, for the release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p image-out
          docker save "$IMAGE:$VERSION" | zstd -T0 -10 -q -o "image-out/lgr-server-${VERSION}-image-amd64.tar.zst"
          for kind in compose k8s; do
            sed -E 's/\$\{LGR_SERVER_VERSION[^}]*\}/'"$VERSION"'/g' "packages/server/packaging/docker/$kind.yaml" > "image-out/lgr-server-${VERSION}-$kind.yaml"
          done
          if grep -n '{LGR_SERVER_VERSION' image-out/*.yaml; then echo "::error::a file still names no version"; exit 1; fi
          cd image-out && for f in *; do sha256sum "$f" | awk '{print $1"  "$2}' > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: image
          path: image-out/
          if-no-files-found: error
          retention-days: 14
          # zstd already.
          compression-level: 0

  # Signing runs whenever the build is signed (a tag, or a dispatch even when it publishes nothing),
  # so a dispatch proves the keys before a tag needs them. The release job publishes what it signed.
  sign:
    needs: [version, windows, linux, image]
    if: needs.version.outputs.sign == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      # The updater's public key (packages/desktop/src-tauri/updater.pub) and .bun-version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # The packages only: without a pattern the API's server-package artifact came along too, and
      # `release/*` would have published its server-manifest.json as a release asset.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{windows,linux,image}'
          path: release
          merge-multiple: true
      - name: Only the packages
        run: |
          set -euo pipefail
          ls -la release
          if find release -mindepth 1 -type d | grep -q .; then echo "::error::a directory came with the packages"; exit 1; fi
          # The image (.tar.zst) and its compose and k8s files are packages too (FR-20.12).
          if ls release | grep -vqE '\.(msi|zip|deb|tar\.gz|tar\.zst|yaml)(\.sha256)?$'; then echo "::error::something that is not a package came with them"; exit 1; fi

      # FR-20.20: the update signature. A master installs a bundle only when minisign accepts it
      # against the key its own package carries (the desktop updater's, FR-14.28) AND the platform
      # signature does too. Verified here against that very key, so a release whose secret and
      # updater.pub do not belong together fails now, not on every master.
      - name: Sign the update bundles with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty in the release environment"; exit 1; }
          shopt -s nullglob
          bundles=(release/*.zip release/*.tar.gz)
          [ ${#bundles[@]} -eq 2 ] || { echo "::error::expected 2 update bundles, found ${#bundles[@]}"; exit 1; }
          for f in "${bundles[@]}"; do bunx @tauri-apps/cli@2.10.1 signer sign "$f"; done
          sudo apt-get install -y -qq minisign > /dev/null
          base64 -d packages/desktop/src-tauri/updater.pub > "$RUNNER_TEMP/updater.pub"
          for f in "${bundles[@]}"; do
            base64 -d "$f.sig" > "$RUNNER_TEMP/bundle.minisig"
            minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$f" -x "$RUNNER_TEMP/bundle.minisig"
          done

      # FR-20.50 (P3-8c): the release's SUPTO version beside its bundles, for lgrai.app's update offer:
      # a master holds an undeclared one once anything is declared. The bundles' HOME.json carries it
      # too, and that, inside the signed bytes, is what the master checks the offer against.
      - name: The release's SUPTO version
        run: |
          set -euo pipefail
          v='${{ needs.version.outputs.version }}'
          supto="$(jq -er '.version' packages/config/src/supto.json)"
          [[ "$supto" =~ ^[0-9A-Za-z][0-9A-Za-z.-]{0,19}$ ]] || { echo "::error::packages/config/src/supto.json names no SUPTO version"; exit 1; }
          printf '%s\n' "$supto" > "release/lgr-server-$v.supto"
          echo "SUPTO version $supto"

      - name: Sign every asset with roomler's release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID:      ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          for v in GPG_PRIVATE_KEY GPG_PASSPHRASE GPG_KEY_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is empty in the release environment"; exit 1; }
          done
          export GNUPGHOME="$RUNNER_TEMP/gnupg-sign"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          shopt -s nullglob
          assets=(release/*.msi release/*.zip release/*.deb release/*.tar.gz release/*.tar.zst release/*.yaml)
          [ ${#assets[@]} -ge 7 ] || { echo "::error::expected an MSI, a zip, a .deb, a tarball, the image and its compose and k8s files, found ${#assets[@]}"; exit 1; }
          for f in "${assets[@]}"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
          done
          # Verified in a clean keyring holding only the key roomler publishes: the check a user makes.
          export GNUPGHOME="$RUNNER_TEMP/gnupg-verify"
          mkdir -m 700 -p "$GNUPGHOME"
          curl -fsSL https://github.com/gjovanov/roomler-ai/releases/latest/download/roomler-release-pubkey.asc | gpg --batch --import
          for f in "${assets[@]}"; do
            gpg --batch --status-fd 1 --verify "$f.asc" "$f" > "$RUNNER_TEMP/v.txt"
            grep -q '^\[GNUPG:\] VALIDSIG' "$RUNNER_TEMP/v.txt" || { echo "::error::$f.asc does not verify"; exit 1; }
          done
          ls -la release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, sign]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed
          path: release

      - name: Build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: 'release/*'

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LGR Server ${{ needs.version.outputs.version }}
          # Until the updater (P1-8) and the field lanes (P2-8) have run it, a server release is a preview.
          prerelease: true
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

  # FR-20.12: the published release's image on GHCR, `ghcr.io/gjovanov/lgr-server:<version>`: the bytes
  # the release carries as its .tar.zst (checked against its .sha256), with build provenance. Never a
  # `latest` while server releases are previews. ⚠ The first push creates the package PRIVATE: make
  # it public once, in its settings on GitHub.
  image-publish:
    needs: [version, image, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/gjovanov/lgr-server
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image
          path: image
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tarball="lgr-server-${VERSION}-image-amd64.tar.zst"
          (cd image && sha256sum -c "$tarball.sha256")
          zstd -dc "image/$tarball" | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          digest="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE:$VERSION ${digest#*@}"
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-name: ghcr.io/gjovanov/lgr-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
